<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎮 Escondidijo Extremo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c14;
  --bg2:#12131f;
  --panel:#171827;
  --panel2:#1e2033;
  --line:#2a2c42;
  --text:#eef0ff;
  --dim:#9295b8;
  --pink:#ff2e63;
  --pink-dim:#7a1633;
  --cyan:#22e5c9;
  --gold:#ffcb47;
  --bad:#ff5470;
  --good:#22e5c9;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --radius: 18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 0%, #201233 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, #0e2a2b 0%, transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100%;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  overscroll-behavior:none;
}
h1,h2,h3,.display{
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:0.5px;
  line-height:1.05;
}
.app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:none;
  padding:14px 20px; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30; background:rgba(11,12,20,.85); backdrop-filter:blur(8px);
}
.topbar .brand{font-family:'Bebas Neue'; font-size:26px; color:var(--pink);}
.topnav{display:flex; gap:4px;}
.topnav button{
  background:none; border:none; color:var(--dim); font-family:'Inter'; font-weight:600;
  font-size:13px; padding:8px 12px; border-radius:10px; cursor:pointer;
}
.topnav button.active{color:var(--text); background:var(--panel2);}
main{flex:1; padding:18px 16px 100px; position:relative;}
.screen{display:none; animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.hero{text-align:center; padding:14vh 6px 30px;}
.hero .logo{font-size:56px; color:var(--pink); text-shadow:0 0 30px rgba(255,46,99,.5);}
.hero .tag{color:var(--dim); font-size:15px; margin-top:6px;}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:18px; border-radius:16px; border:none; cursor:pointer;
  font-family:'Inter'; font-weight:700; font-size:16px; margin-top:12px;
  transition:transform .12s ease, filter .12s ease;
  -webkit-user-select:none; user-select:none;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--pink),#ff5f8f); color:#fff; box-shadow:0 8px 24px rgba(255,46,99,.35);}
.btn-secondary{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#1bc2ab); color:#00251f; box-shadow:0 8px 24px rgba(34,229,201,.3);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#ffb238); color:#2b1900;}
.btn-ghost{background:none; color:var(--dim); border:1px dashed var(--line);}
.btn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.5);}
.btn small{font-weight:500; opacity:.8;}

.card-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.card-box h3{margin:0 0 10px; font-size:22px; color:var(--text);}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); font-weight:700; margin:22px 0 10px;}

input[type=text]{
  width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--line);
  background:var(--bg2); color:var(--text); font-size:15px; font-family:'Inter';
}
input[type=text]:focus{outline:none; border-color:var(--pink);}

.player-row{display:flex; align-items:center; gap:10px; padding:12px; background:var(--bg2); border-radius:14px; margin-bottom:8px; border:1px solid var(--line);}
.player-row .avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--cyan)); display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;}
.player-row .name{flex:1; font-weight:600;}
.player-row .icon-btn{background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; padding:6px;}

.wheel-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
.wheel-outer{position:relative; width:280px; height:280px; margin:10px auto;}
.wheel{width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden; border:6px solid var(--panel2); box-shadow:0 0 40px rgba(255,46,99,.25), inset 0 0 30px rgba(0,0,0,.4); transition: transform 4s cubic-bezier(.15,.85,.25,1);}
.wheel-pointer{position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:28px; z-index:5;}
.wheel-seg-label{position:absolute; left:50%; top:8%; transform-origin:0 142px; font-weight:800; font-size:12px; color:#fff; white-space:nowrap;}
.wheel-center{position:absolute; top:50%; left:50%; width:54px; height:54px; margin:-27px 0 0 -27px; background:var(--bg); border-radius:50%; border:4px solid var(--gold); z-index:4; display:flex; align-items:center; justify-content:center; font-size:22px;}

.result-badge{text-align:center; margin-top:10px;}
.result-badge .label{color:var(--dim); font-size:13px; letter-spacing:2px; text-transform:uppercase;}
.result-badge .value{font-family:'Bebas Neue'; font-size:44px; color:var(--gold); text-shadow:0 0 20px rgba(255,203,71,.4);}

.status-pill{font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px;}
.status-hidden{background:#232a44; color:#8fa3ff;}
.status-found{background:#4a1522; color:var(--bad);}
.status-liberated{background:#0f3a30; color:var(--good);}

.round-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.round-header .r{font-family:'Bebas Neue'; font-size:34px; color:var(--pink);}
.round-header .meta{text-align:right; font-size:13px; color:var(--dim);}
.round-header .meta b{color:var(--text); display:block; font-size:15px;}

.player-round-row{display:flex; align-items:center; gap:10px; padding:14px; background:var(--bg2); border-radius:14px; margin-bottom:8px; border:1px solid var(--line);}
.player-round-row .name{flex:1; font-weight:700;}
.player-round-row .actions{display:flex; gap:6px;}
.mini-btn{padding:8px 10px; border-radius:10px; border:none; font-size:12px; font-weight:700; cursor:pointer;}
.mini-btn.find{background:var(--panel2); color:var(--text);}
.mini-btn.lib{background:linear-gradient(135deg,var(--cyan),#1bc2ab); color:#00251f;}

.leader-row{display:flex; align-items:center; gap:10px; padding:14px; background:var(--bg2); border-radius:14px; margin-bottom:8px; border:1px solid var(--line);}
.leader-row .rank{font-family:'Bebas Neue'; font-size:26px; width:34px; color:var(--dim); text-align:center;}
.leader-row .info{flex:1;}
.leader-row .info .top{display:flex; justify-content:space-between; font-weight:700;}
.leader-row .bar{height:6px; border-radius:6px; background:var(--panel2); margin-top:6px; overflow:hidden;}
.leader-row .bar > div{height:100%; background:linear-gradient(90deg,var(--pink),var(--gold));}
.extreme-tag{background:linear-gradient(135deg,#7b2fff,#c04dff); color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:10px; margin-left:6px;}

.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(18,19,31,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  max-width:720px; margin:0 auto;
}
.bottomnav button{background:none; border:none; color:var(--dim); font-size:10px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 6px; cursor:pointer;}
.bottomnav button .ic{font-size:19px;}
.bottomnav button.active{color:var(--pink);}

.overlay{position:fixed; inset:0; background:rgba(4,4,8,.72); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.overlay.center{align-items:center; padding:16px;}
.sheet{width:100%; max-width:720px; background:var(--panel); border-radius:22px 22px 0 0; padding:20px; box-shadow:0 -10px 40px rgba(0,0,0,.5); max-height:88vh; overflow-y:auto;}
.overlay.center .sheet{border-radius:22px;}
.sheet .close-row{display:flex; justify-content:flex-end;}
.sheet .x{background:none; border:none; color:var(--dim); font-size:22px; cursor:pointer;}

.facade-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 20px; touch-action:none;}
.facade-stage{position:relative; width:230px; height:330px; perspective:1000px;}
.facade{
  position:absolute; inset:0; border-radius:20px;
  background:linear-gradient(160deg,#22243a,#14152233);
  background-color:#1c1e33;
  border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
  cursor:grab; will-change:transform;
}
.facade .big{font-size:44px;}
.facade .who{font-family:'Bebas Neue'; font-size:26px; color:var(--gold);}
.facade .hint{color:var(--dim); font-size:12px; text-align:center; padding:0 20px;}
.facade .arrow{font-size:22px; color:var(--pink); animation:bob 1.4s infinite;}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}}
.card-face{
  position:absolute; inset:0; border-radius:20px; padding:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
  border:1px solid var(--line);
}
.card-face.good{background:linear-gradient(160deg,#0f3a30,#0a2620);}
.card-face.bad{background:linear-gradient(160deg,#3a1522,#26101a);}
.card-face .tag{font-size:34px;}
.card-face .title{font-family:'Bebas Neue'; font-size:24px;}
.card-face .body{font-size:13px; color:#d8d9ec; line-height:1.5;}

.timer-box{display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 0;}
.timer-display{font-family:'Bebas Neue'; font-size:80px; color:var(--gold); text-shadow:0 0 30px rgba(255,203,71,.35);}
.timer-presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.timer-presets button{padding:10px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-weight:700; cursor:pointer;}
.timer-controls{display:flex; gap:10px;}
.timer-controls button{flex:1;}

.hist-round{margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);}
.hist-round:last-child{border-bottom:none;}
.hist-round h4{margin:0 0 8px; font-family:'Bebas Neue'; font-size:20px; color:var(--pink);}
.hist-line{font-size:13px; color:var(--dim); margin-bottom:3px;}
.hist-line b{color:var(--text);}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-card{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:14px;}
.stat-card .k{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px;}
.stat-card .v{font-family:'Bebas Neue'; font-size:22px; margin-top:4px;}
.stat-card .v small{font-size:13px; color:var(--dim); font-family:'Inter'; font-weight:600;}

.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--line);}
.switch{width:46px; height:26px; border-radius:20px; background:var(--panel2); position:relative; cursor:pointer; flex-shrink:0;}
.switch.on{background:var(--cyan);}
.switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease;}
.switch.on .knob{left:23px;}

.rules-block{margin-bottom:18px;}
.rules-block h4{color:var(--cyan); font-size:16px; margin-bottom:4px;}
.rules-block p{font-size:13.5px; color:#c9cbe6; line-height:1.6; margin:4px 0;}

.momento{text-align:center; padding:30px 10px;}
.momento .flame{font-size:48px;}
.momento h2{color:var(--gold); font-size:30px; margin:6px 0;}
.momento p{color:var(--dim); font-size:15px;}

.victory{text-align:center; padding:60px 10px 20px;}
.victory .cups{font-size:44px;}
.victory h1{color:var(--gold); font-size:52px; margin:10px 0 0;}
.victory .name{font-family:'Bebas Neue'; font-size:44px; color:var(--pink); margin:6px 0;}
.victory .pts{color:var(--dim); font-size:18px;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:12px 20px; border-radius:14px; font-weight:600; font-size:14px; z-index:200; box-shadow:var(--shadow); max-width:88%; text-align:center;}

.badge-locked{background:#2a2c42; color:var(--dim); border:1px dashed var(--line);}
.presenter-big{text-align:center; padding:10px 0 20px;}
.presenter-big .r{font-family:'Bebas Neue'; font-size:60px; color:var(--pink);}
.presenter-big .searcher{font-family:'Bebas Neue'; font-size:38px; color:var(--gold);}

.sound-toggle-fab{position:fixed; top:14px; right:14px; z-index:50; background:var(--panel2); border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

@media (min-width:760px){
  .topbar{display:flex;}
  .bottomnav{display:none;}
  main{padding-bottom:40px;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="brand">🎮 ESCONDIDIJO</div>
    <div class="topnav" id="topnav"></div>
  </div>

  <button class="sound-toggle-fab" id="soundFab" onclick="toggleSound()">🔊</button>

  <main id="main"></main>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="overlays"></div>
<div id="toastHost"></div>

<script>
/* =========================================================
   ESCONDIDIJO EXTREMO — LÓGICA COMPLETA
   ========================================================= */

const CARDS = [
  {id:1, type:'good', title:'SEGUNDO ESCONDITE', emoji:'🟢', text:'Si te encuentran, tienes 15 segundos para encontrar un nuevo escondite. Durante esos 15 segundos, el Buscador NO puede perseguirte. Cuando encuentres tu nuevo escondite, debes permanecer allí.'},
  {id:2, type:'bad', title:'ESTATUA', emoji:'🔴', text:'Cuando te encuentren, debes quedarte completamente quieto durante 5 segundos. Después puedes intentar liberarte normalmente.'},
  {id:3, type:'bad', title:'GRITO EXTREMO', emoji:'🔴', text:'Cuando te encuentren, debes gritar tu nombre durante 5 segundos. Después puedes intentar liberarte normalmente.'},
  {id:4, type:'bad', title:'CAMINO LENTO', emoji:'🔴', text:'Durante 10 segundos no puedes correr. Puedes caminar normalmente e intentar escapar.'},
  {id:5, type:'bad', title:'CAMBIO OBLIGATORIO', emoji:'🔴', text:'Debes abandonar tu escondite y encontrar otro en 10 segundos. El Buscador no puede perseguirte durante los primeros 3 segundos.'},
  {id:6, type:'bad', title:'ESCÓNDETE OTRA VEZ', emoji:'🔴', text:'Cuando te encuentren, tienes 10 segundos para buscar otro escondite. El Buscador puede perseguirte. Si consigues esconderte sin que vuelva a encontrarte, quedas libre.'},
  {id:7, type:'bad', title:'SONIDO EXTRAÑO', emoji:'🔴', text:'Mientras estés escondido, debes hacer durante 3 segundos un sonido extraño que no sea un grito normal (MEOWWW, GÑÑÑÑ, BRRRRR, PI PI PI...). No puedes gritar "AAAAAA" ni decir una palabra normal. Después puedes quedarte escondido o cambiar de posición.'},
  {id:8, type:'bad', title:'PAUSA', emoji:'🔴', text:'Cuando te encuentren, debes esperar 5 segundos antes de poder moverte. Después puedes intentar escapar normalmente.'},
  {id:9, type:'bad', title:'DOS CAMINOS', emoji:'🔴', text:'Cuando te encuentren debes elegir: A) Esperar 5 segundos antes de moverte. B) Salir inmediatamente, pero durante los primeros 5 segundos solo puedes caminar. Tú decides qué opción te conviene más.'},
  {id:10, type:'bad', title:'VUELTA ATRÁS', emoji:'🔴', text:'Cuando te encuentren, debes retroceder hasta un punto que elijas antes de poder escapar. Puedes elegir el camino que quieras para llegar hasta allí.'},
  {id:11, type:'bad', title:'ÚLTIMO INTENTO', emoji:'🔴', text:'Cuando te encuentren tienes 5 segundos para elegir: ESCAPAR (correr inmediatamente hacia el Punto de Liberación) o ESCONDERTE (encontrar un escondite cercano y permanecer allí durante 10 segundos).'}
];

const SAVE_KEY = 'escondidijo_extremo_save_v1';

function freshState(){
  return {
    screen:'home',
    players:[], // {id,name,points,liberations,foundCount,rescues,rescuedCount,streak,extremeMode,extremeRoundsLeft,lastLiberationBonusAt}
    round:0,
    currentSearcherId:null,
    lastSearcherId:null,
    liberationPoint:'',
    roundData:null, // {statuses:{id:'hidden'|'found'|'liberated'}, cards:{id:cardId}, firstLiberatorId, rescuedThisRound:Set, lastFoundId}
    rescueLocks:{}, // liberatorId -> {targetId: roundsLeft}
    finalHunt:{active:false, triggerRound:null},
    winner:null,
    history:[], // round summaries
    tempSelectedPlayer:null,
    stats:{},
    settings:{sound:true, animations:true},
    undoStack:[],
    _timer:{seconds:0, running:false, initial:0}
  };
}

let state = loadFromStorage() || freshState();
let audioCtx = null;

/* ---------------- persistence ---------------- */
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){ console.warn('No se pudo guardar', e); }
}
function loadFromStorage(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function loadGame(){
  const s = loadFromStorage();
  if(s){ state = s; render(); showToast('Partida cargada'); }
}
function deleteSave(){
  localStorage.removeItem(SAVE_KEY);
  state = freshState();
  render();
}

/* ---------------- undo ---------------- */
function pushUndo(){
  const snap = JSON.stringify(state);
  state.undoStack = state.undoStack || [];
  state.undoStack.push(snap);
  if(state.undoStack.length > 12) state.undoStack.shift();
}
function undoLastAction(){
  if(!state.undoStack || state.undoStack.length===0){ showToast('Nada que deshacer'); return; }
  const prev = state.undoStack.pop();
  const stack = state.undoStack;
  state = JSON.parse(prev);
  state.undoStack = stack;
  saveGame();
  render();
  showToast('Acción deshecha ↩️');
}

/* ---------------- sound (Web Audio API) ---------------- */
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx,freq,start,dur,type='sine',gain=0.18){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime+start);
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(gain, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+start);
  o.stop(ctx.currentTime+start+dur+0.05);
}
function noiseBurst(ctx,start,dur,gain=0.12){
  const bufferSize = ctx.sampleRate*dur;
  const buffer = ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const src = ctx.createBufferSource(); src.buffer=buffer;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain, ctx.currentTime+start);
  src.connect(g); g.connect(ctx.destination);
  src.start(ctx.currentTime+start);
}
function playUiSound(kind){
  if(!state.settings.sound) return;
  const ctx = ensureAudio(); if(!ctx) return;
  if(kind==='click') tone(ctx,600,0,0.08,'square',0.08);
  else if(kind==='point') { tone(ctx,880,0,0.12,'triangle',0.15); tone(ctx,1100,0.08,0.15,'triangle',0.12); }
  else if(kind==='liberate') { tone(ctx,660,0,0.1,'sine',0.15); tone(ctx,990,0.09,0.2,'sine',0.15); }
  else if(kind==='rescue') { tone(ctx,520,0,0.1,'sine',0.15); tone(ctx,780,0.08,0.1,'sine',0.15); tone(ctx,1040,0.16,0.2,'sine',0.15); }
  else if(kind==='extreme') { tone(ctx,220,0,0.3,'sawtooth',0.12); tone(ctx,440,0.1,0.3,'sawtooth',0.1); }
  else if(kind==='lasthunt') { tone(ctx,180,0,0.4,'square',0.15); noiseBurst(ctx,0,0.4,0.08); }
  else if(kind==='victory') { [523,659,784,1046].forEach((f,i)=>tone(ctx,f,i*0.13,0.3,'triangle',0.16)); }
  else if(kind==='wheel') { for(let i=0;i<8;i++) tone(ctx,300+i*40,i*0.18,0.1,'square',0.06); }
  else if(kind==='timer') tone(ctx,900,0,0.06,'square',0.1);
}
// 6 distinct, misleading reveal effects — independent of card content
const REVEAL_EFFECTS = [
  (ctx)=>{ tone(ctx,300,0,0.35,'sawtooth',0.12); tone(ctx,700,0.05,0.25,'sawtooth',0.08); }, // whoosh-ish
  (ctx)=>{ tone(ctx,1200,0,0.05,'square',0.14); tone(ctx,1500,0.09,0.18,'sine',0.15); }, // click+ding
  (ctx)=>{ tone(ctx,440,0,0.2,'sine',0.1); tone(ctx,330,0.15,0.25,'sine',0.1); tone(ctx,550,0.3,0.2,'sine',0.1); }, // misterioso
  (ctx)=>{ tone(ctx,900,0,0.08,'triangle',0.16); }, // pop
  (ctx)=>{ tone(ctx,660,0,0.12,'sine',0.12); tone(ctx,880,0.1,0.12,'sine',0.12); tone(ctx,1100,0.2,0.2,'sine',0.14); }, // magic
  (ctx)=>{ noiseBurst(ctx,0,0.15,0.1); tone(ctx,500,0.05,0.15,'square',0.1); } // sorpresa
];
function playCardRevealSound(){
  if(!state.settings.sound) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const fx = REVEAL_EFFECTS[Math.floor(Math.random()*REVEAL_EFFECTS.length)];
  fx(ctx);
}

function addPlayer(name){

  if(!name) return;

  state.players.push({

    streak:0, extremeMode:false, extremeRoundsLeft:0, timesSearcher:0, timesLastFound:0
  });
  saveGame(); render();
}
function removePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  saveGame(); render();
}
function editPlayer(id, newName){
  const p = state.players.find(p=>p.id===id);
  if(p && newName.trim()) p.name = newName.trim();
  saveGame(); render();
}
function getPlayer(id){ return state.players.find(p=>p.id===id); }

/* ---------------- roulette ---------------- */
function eligibleSearchers(){
  if(state.players.length<=1) return state.players.slice();
  const others = state.players.filter(p=>p.id!==state.lastSearcherId);
  return others.length>0 ? others : state.players.slice();
}
function spinWheel(){
  playUiSound('wheel');
  const wheelEl = document.getElementById('wheelEl');
  const pool = eligibleSearchers();
  const winner = pool[Math.floor(Math.random()*pool.length)];
  const segAngle = 360/pool.length;
  const winnerIndex = pool.findIndex(p=>p.id===winner.id);
  const targetAngle = 360*5 + (360 - (winnerIndex*segAngle + segAngle/2)) ;
  if(wheelEl){
    wheelEl.style.transform = `rotate(${targetAngle}deg)`;
  }
  setTimeout(()=>{
    state.currentSearcherId = winner.id;
    winner.timesSearcher = (winner.timesSearcher||0)+1;
    saveGame();
    document.getElementById('wheelResult').style.display='block';
    document.getElementById('wheelResultName').textContent = winner.name.toUpperCase();
  }, 4050);
}

/* ---------------- round lifecycle ---------------- */
function goToRoulette(){
  if(state.players.length<3){ showToast('Se necesitan al menos 3 jugadores'); return; }
  state.screen='roulette';
  render();
}
function askLiberationPointAndStart(){
  const input = document.getElementById('liberationInput');
  const val = (input?.value||'').trim();
  if(!val){ showToast('Escribe el Punto de Liberación'); return; }
  state.liberationPoint = val;
  startRound();
}
function shuffleCards(){
  const arr = CARDS.map(c=>c.id);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function assignCards(hidingPlayers){
  const shuffled = shuffleCards();
  const map = {};
  hidingPlayers.forEach((p,i)=>{ map[p.id] = shuffled[i % shuffled.length] && i < shuffled.length ? shuffled[i] : shuffled[i]; });
  // ensure no repeats & searcher gets none: since hidingPlayers <=10 and 11 cards, safe
  hidingPlayers.forEach((p,i)=>{ map[p.id] = shuffled[i]; });
  return map;
}
function startRound(){
  pushUndo();
  state.round += 1;
  const hidingPlayers = state.players.filter(p=>p.id!==state.currentSearcherId);
  const cardMap = assignCards(hidingPlayers);
  const statuses = {};
  hidingPlayers.forEach(p=>{ statuses[p.id] = 'hidden'; });
  state.roundData = {
    statuses,
    cards: cardMap,
    firstLiberatorId: null,
    lastFoundId: null,
    log: [] // {playerId,event,points}
  };
  state.lastSearcherId = state.currentSearcherId;
  state.screen = 'round';
  saveGame();
  render();
}

function hiddenRemaining(){
  const rd = state.roundData; if(!rd) return [];
  return Object.keys(rd.statuses).filter(id=>rd.statuses[id]==='hidden');
}

function openFindModal(){
  const rd = state.roundData;
  const hidden = hiddenRemaining();
  if(hidden.length===0){ showToast('No quedan jugadores escondidos'); return; }
  renderOverlay('find', {hidden});
}
function findPlayer(playerId){
  pushUndo();
  const rd = state.roundData;
  const wasLastHidden = hiddenRemaining().length===1 && hiddenRemaining()[0]===playerId;
  rd.statuses[playerId] = 'found';
  const p = getPlayer(playerId);
  p.foundCount = (p.foundCount||0)+1;
  // streak breaks on being found (unless later liberated)
  if(wasLastHidden){
    rd.lastFoundId = playerId;
    p.timesLastFound = (p.timesLastFound||0)+1;
  }
  saveGame();
  closeOverlay();
  const card = CARDS.find(c=>c.id===rd.cards[playerId]);
  renderOverlay('cardReveal', {playerId, card, mode:'found'});
}

function openLiberateModal(){
  const rd = state.roundData;
  const eligible = Object.keys(rd.statuses).filter(id=>rd.statuses[id]==='hidden'||rd.statuses[id]==='found');
  if(eligible.length===0){ showToast('No hay jugadores disponibles'); return; }
  renderOverlay('liberate', {eligible});
}
function liberatePlayer(playerId){
  pushUndo();
  const rd = state.roundData;
  const wasFound = rd.statuses[playerId]==='found';
  const wasLastFound = rd.lastFoundId===playerId;
  rd.statuses[playerId] = 'liberated';
  const p = getPlayer(playerId);
  p.liberations = (p.liberations||0)+1;

  // streak logic
  p.streak = (p.streak||0)+1;
  let bonus = 0;
  if(p.streak>0 && p.streak%3===0 && !p.extremeMode) bonus = 1;

  const base = wasFound ? 2 : 3;
  const awarded = p.extremeMode ? 0 : (base+bonus);
  p.points += awarded;

  rd.log.push({playerId, event: wasFound?'liberado_tras_encontrado':'liberado_directo', points:awarded});

  const isFirstLiberator = !rd.firstLiberatorId;
  if(isFirstLiberator) rd.firstLiberatorId = playerId;

  saveGame();
  closeOverlay();
  checkGameStateAfterPoints(p);

  if(isFirstLiberator){
    const trapped = Object.keys(rd.statuses).filter(id=> rd.statuses[id]==='found' );
    if(trapped.length>0){
      renderOverlay('rescue', {liberatorId:playerId, trapped});
      return;
    }
  }
  checkRoundEnd();
  render();
}
function rescuePlayer(liberatorId, targetId){
  const rd = state.roundData;
  if(rd.rescueUsed){ showToast('Ya hubo un rescate en esta ronda'); return; }
  if(rd.statuses[targetId]!=='found'){ showToast('Ese jugador no está atrapado'); return; }
  pushUndo();
  rd.rescueUsed = true;
  rd.statuses[targetId] = 'liberated';
  const target = getPlayer(targetId);
  const liberator = getPlayer(liberatorId);
  target.liberations = (target.liberations||0)+1;
  target.rescuedCount = (target.rescuedCount||0)+1;
  liberator.rescues = (liberator.rescues||0)+1;
  // lock: liberator can't rescue this same target for next 3 rounds
  state.rescueLocks[liberatorId] = state.rescueLocks[liberatorId] || {};
  state.rescueLocks[liberatorId][targetId] = 3;

  rd.log.push({playerId:targetId, event:'rescatado_por_'+liberator.name, points:0});
  saveGame();
  closeOverlay();
  showToast(`${liberator.name} liberó a ${target.name} 🤝`);
  checkRoundEnd();
  render();
}
function searcherFreesPlayer(playerId){
  const rd = state.roundData;
  if(!rd || rd.statuses[playerId]!=='found') return;
  pushUndo();
  rd.statuses[playerId] = 'liberated';
  const p = getPlayer(playerId);
  p.streak = 0; // no se liberó por sí mismo
  const searcher = getPlayer(state.currentSearcherId);
  rd.log.push({playerId, event:'liberado_por_buscador', points:0});
  saveGame();
  closeOverlay();
  showToast(`${searcher?searcher.name:'El Buscador'} liberó a ${p.name} 🔎`);
  checkRoundEnd();
  render();
}
function isRescueLocked(liberatorId, targetId){
  const locks = state.rescueLocks[liberatorId];
  return !!(locks && locks[targetId] && locks[targetId]>0);
}

function checkGameStateAfterPoints(p){
  if(p.points>=9 && !p.extremeMode && p.extremeRoundsLeft===undefined) p.extremeRoundsLeft=0;
  if(p.points>=9 && !p.extremeMode && p.points<12){
    p.extremeMode = true;
    p.extremeRoundsLeft = 3;
    playUiSound('extreme');
    showToast(`👑 ${p.name} entra en MODO EXTREMO`);
  } else {
    playUiSound('point');
  }
  if(p.points>=10 && !state.finalHunt.active){
    state.finalHunt.active = true;
    state.finalHunt.triggerRound = state.round;
    playUiSound('lasthunt');
    showToast('🚨 ÚLTIMA CAZA ACTIVADA');
  }
  if(p.points>=12 && !p.extremeMode){
    declareWinner(p);
  }
}
function declareWinner(p){
  state.winner = p.id;
  state.screen='victory';
  playUiSound('victory');
  saveGame();
}

function decrementExtremeAndRescueLocks(){
  state.players.forEach(p=>{
    if(p.extremeMode){
      p.extremeRoundsLeft -= 1;
      if(p.extremeRoundsLeft<=0){
        p.extremeMode=false;
        p.extremeRoundsLeft=0;
        showToast(`${p.name} sale de Modo Extremo`);
        if(p.points>=12){ declareWinner(p); }
      }
    }
  });
  Object.keys(state.rescueLocks).forEach(lib=>{
    Object.keys(state.rescueLocks[lib]).forEach(tgt=>{
      state.rescueLocks[lib][tgt] -= 1;
      if(state.rescueLocks[lib][tgt]<=0) delete state.rescueLocks[lib][tgt];
    });
  });
}

function checkRoundEnd(){
  if(hiddenRemaining().length>0) return;
  const rd = state.roundData;
  // resolve any found-not-liberated players
  Object.keys(rd.statuses).forEach(id=>{
    if(rd.statuses[id]==='found'){
      const p = getPlayer(id);
      p.streak = 0; // streak broken
      const isLast = rd.lastFoundId===id;
      const awarded = p.extremeMode ? 0 : (isLast?1:0);
      p.points += awarded;
      rd.log.push({playerId:id, event: isLast?'ultimo_encontrado':'encontrado_no_liberado', points:awarded});
      if(awarded>0) checkGameStateAfterPoints(p);
    } else if(rd.statuses[id]==='liberated'){
      // streak already updated at liberation time
    }
  });
  // build history entry
  const entry = {
    round: state.round,
    searcherId: state.currentSearcherId,
    liberationPoint: state.liberationPoint,
    log: rd.log.slice(),
    cards: {...rd.cards},
    statuses: {...rd.statuses}
  };
  state.history.push(entry);
  decrementExtremeAndRescueLocks();
  saveGame();

  if(state.winner){ return; }
  if(state.finalHunt.active && state.round > state.finalHunt.triggerRound){
    finishGameByLastHunt();
    return;
  }
  showMomentOfRound(entry);
}
function computeMomentOfRound(entry){
  const opts = [];
  if(entry.lastFoundId===undefined){}
  const lastFound = Object.keys(entry.statuses).find(id=>state.roundData && state.roundData.lastFoundId===id);
  const rd = state.roundData;
  if(rd.lastFoundId){
    const p = getPlayer(rd.lastFoundId);
    if(p) opts.push(`${p.name.toUpperCase()} fue el último jugador encontrado.`);
  }
  const notFound = state.players.filter(p=> entry.statuses[p.id]==='liberated' && !entry.log.find(l=>l.playerId===p.id && l.event==='liberado_tras_encontrado'));
  if(notFound.length>0){
    const pick = notFound[Math.floor(Math.random()*notFound.length)];
    opts.push(`${pick.name.toUpperCase()} no fue encontrado y se liberó sin ser visto.`);
  }
  const rescuer = entry.log.find(l=>l.event && l.event.startsWith('rescatado_por_'));
  if(rescuer){
    opts.push(`Hubo un rescate heroico que cambió la ronda.`);
  }
  const topScorer = [...state.players].sort((a,b)=>b.points-a.points)[0];
  if(topScorer) opts.push(`${topScorer.name.toUpperCase()} lidera la clasificación con ${topScorer.points} puntos.`);
  if(opts.length===0) opts.push('Ronda completada sin grandes sorpresas.');
  return opts[Math.floor(Math.random()*opts.length)];
}
function showMomentOfRound(entry){
  const msg = computeMomentOfRound(entry);
  state.screen='moment';
  state._momentMsg = msg;
  saveGame();
  render();
}
function finishGameByLastHunt(){
  const sorted = [...state.players].sort((a,b)=>b.points-a.points);
  const top = sorted[0];
  const tied = sorted.filter(p=>p.points===top.points);
  if(tied.length>1){
    state.screen='tiebreak';
    state._tied = tied.map(p=>p.id);
    saveGame(); render();
  } else {
    declareWinner(top);
    render();
  }
}
function nextRoundFromMoment(){
  state.roundData = null;
  state.tempSelectedPlayer=null;
  state.screen='roulette';
  render();
}

function buildWheelSVG(pool){
  const n = pool.length, seg = 360/n;
  const colors = ['#e0245e','#6a2fd6','#0f9d8a','#d98a00','#2f6fe0'];
  const pt = (deg,r)=>{ const a=(deg-90)*Math.PI/180; return [ (r*Math.cos(a)).toFixed(2), (r*Math.sin(a)).toFixed(2) ]; };
  let out = '';
  pool.forEach((p,i)=>{
    let col = colors[i%colors.length];
    if(i===n-1 && n>1 && col===colors[0]) col = colors[(i+2)%colors.length];
    const a0=i*seg, a1=(i+1)*seg;
    const [x0,y0]=pt(a0,100), [x1,y1]=pt(a1,100);
    const large = seg>180?1:0;
    out += `<path d="M0 0 L${x0} ${y0} A100 100 0 ${large} 1 ${x1} ${y1} Z" fill="${col}" stroke="#0b0c14" stroke-width="1.2"/>`;
    let name = p.name.toUpperCase();
    if(name.length>11) name = name.slice(0,10)+'…';
    const fs = Math.max(7, Math.min(13, 62/Math.max(name.length,4)*1.5));
    const mid = a0+seg/2;
    out += `<text transform="rotate(${mid-90})" x="92" y="0" text-anchor="end" dominant-baseline="central" font-family="Inter,sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round">${name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;
  });
  return `<svg viewBox="-100 -100 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${out}</svg>`;
}

/* ---------------- overlays / modals ---------------- */
function closeOverlay(){
  const host = document.getElementById('overlays');
  host.innerHTML='';
}
function renderOverlay(kind, data){
  const host = document.getElementById('overlays');
  host.innerHTML='';
  if(kind==='confirmNewGame'){
    const ov = el(`
      <div class="overlay center">
        <div class="sheet" style="max-width:340px;">
          <h3>¿Nueva partida?</h3>
          <p style="color:var(--dim); font-size:14px;">Ya existe una partida guardada. Empezar una nueva la reemplazará.</p>
          <button class="btn btn-primary" onclick="confirmNewGame()">Sí, empezar nueva</button>
          <button class="btn btn-ghost" onclick="closeOverlay()">Cancelar</button>
        </div>
      </div>`);
    host.appendChild(ov);
    return;
  }
  if(kind==='find'){
    const ov = el(`<div class="overlay"><div class="sheet"><div class="close-row"><button class="x" onclick="closeOverlay()">✕</button></div><h3>🔎 ¿A quién encontraste?</h3></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.hidden.forEach(id=>{
      const p = getPlayer(id);
      const b = el(`<button class="btn btn-secondary">${p.name}</button>`);
      b.onclick = ()=> findPlayer(id);
      sheet.appendChild(b);
    });
    host.appendChild(ov);
    return;
  }
  if(kind==='cardReveal'){
    renderCardRevealOverlay(data);
    return;
  }
  if(kind==='liberate'){
    const rd = state.roundData;
    const ov = el(`<div class="overlay"><div class="sheet"><div class="close-row"><button class="x" onclick="closeOverlay()">✕</button></div><h3>🟢 ¿Quién se liberó?</h3><p style="color:var(--dim); font-size:13px;">Elige si el jugador se liberó por sí mismo (¡POR MÍ!) o si lo liberó otro jugador (rescate).</p></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.eligible.forEach(id=>{
      const p = getPlayer(id);
      const wasFound = rd.statuses[id]==='found';
      const card = el(`<div class="card-box" style="padding:12px; margin-bottom:10px;"><div style="font-weight:700; margin-bottom:8px;">${p.name} <span class="status-pill ${wasFound?'status-found':'status-hidden'}">${wasFound?'Encontrado':'Escondido'}</span></div></div>`);
      const self = el(`<button class="btn btn-cyan" style="margin-top:0;">🟢 Se liberó solo (¡POR MÍ!) · ${wasFound?'+2':'+3'}</button>`);
      self.onclick = ()=> liberatePlayer(id);
      card.appendChild(self);
      if(wasFound){
        const libId = rd.firstLiberatorId;
        let label, disabled=false, note='';
        if(!libId){ label='🤝 Lo liberó otro jugador'; disabled=true; note='Solo el primer jugador liberado puede rescatar. Aún nadie se ha liberado.'; }
        else if(rd.rescueUsed){ label='🤝 Lo liberó otro jugador'; disabled=true; note='Ya hubo un rescate en esta ronda.'; }
        else if(isRescueLocked(libId,id)){ label='🤝 Lo liberó '+getPlayer(libId).name; disabled=true; note='🔒 No disponible durante '+state.rescueLocks[libId][id]+' rondas.'; }
        else { label='🤝 Lo liberó '+getPlayer(libId).name+' (rescate)'; }
        const resc = el(`<button class="btn ${disabled?'btn-ghost':'btn-gold'}" ${disabled?'disabled':''}>${label}</button>`);
        if(!disabled) resc.onclick = ()=> rescuePlayer(libId,id);
        card.appendChild(resc);
        const sb = el(`<button class="btn btn-secondary">🔎 Lo liberó el Buscador · 0 puntos</button>`);
        sb.onclick = ()=> searcherFreesPlayer(id);
        card.appendChild(sb);
        if(note) card.appendChild(el(`<div style="font-size:12px; color:var(--dim); margin-top:6px;">${note}</div>`));
      }
      sheet.appendChild(card);
    });
    host.appendChild(ov);
    return;
  }
  if(kind==='rescue'){
    const ov = el(`<div class="overlay"><div class="sheet"><h3>🤝 ELIGE A QUIÉN LIBERAR</h3><p style="color:var(--dim); font-size:13px;">El primer jugador en liberarse puede rescatar a un jugador atrapado.</p></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.trapped.forEach(id=>{
      const p = getPlayer(id);
      const locked = isRescueLocked(data.liberatorId, id);
      const b = el(`<button class="btn ${locked?'btn-ghost':'btn-gold'}" ${locked?'disabled':''}>${locked?'🔒 ':''}${p.name} ${locked?'<br><small>No disponible durante '+state.rescueLocks[data.liberatorId][id]+' rondas</small>':''}</button>`);
      if(!locked) b.onclick = ()=> rescuePlayer(data.liberatorId, id);
      sheet.appendChild(b);
    });
    const skip = el(`<button class="btn btn-ghost">No rescatar a nadie</button>`);
    skip.onclick = ()=>{ closeOverlay(); checkRoundEnd(); render(); };
    sheet.appendChild(skip);
    host.appendChild(ov);
    return;
  }
}

function renderCardRevealOverlay({playerId, card, mode}){
  const host = document.getElementById('overlays');
  const p = getPlayer(playerId);
  const ov = el(`
    <div class="overlay center">
      <div class="sheet" style="max-width:280px; background:transparent; box-shadow:none; padding:0;">
        <div class="facade-wrap">
          <div class="facade-stage">
            <div class="card-face ${card.type}" id="cardFace" style="display:none;">
              <div class="tag">${card.emoji}</div>
              <div class="title">${card.title}</div>
              <div class="body">${card.text}</div>
            </div>
            <div class="facade" id="facadeEl">
              <div class="big">🃏</div>
              <div class="who">${p.name.toUpperCase()}</div>
              <div class="arrow">↑</div>
              <div class="hint">DESLIZA PARA REVELAR CARTA</div>
            </div>
          </div>
          <button class="btn btn-ghost" id="hideCardBtn" style="max-width:220px; display:none;">🔒 OCULTAR CARTA</button>
          <button class="btn btn-ghost" style="max-width:220px;" onclick="closeOverlay()">Cerrar</button>
        </div>
      </div>
    </div>`);
  host.appendChild(ov);

  const facade = ov.querySelector('#facadeEl');
  const cardFace = ov.querySelector('#cardFace');
  const hideBtn = ov.querySelector('#hideCardBtn');
  let startY=null, dragging=false, revealed=false;

  function reveal(){
    if(revealed) return;
    revealed = true;
    playCardRevealSound();
    facade.style.transition = 'transform .45s cubic-bezier(.2,.8,.3,1), opacity .45s ease';
    facade.style.transform = 'translateY(-360px) rotate(-8deg)';
    facade.style.opacity='0';
    cardFace.style.display='flex';
    hideBtn.style.display='block';
    setTimeout(()=>{ facade.style.display='none'; }, 460);
  }
  function hide(){
    revealed=false;
    cardFace.style.display='none';
    hideBtn.style.display='none';
    facade.style.display='flex';
    facade.style.transition='none';
    facade.style.transform='translateY(0) rotate(0)';
    facade.style.opacity='1';
  }
  hideBtn.onclick = hide;

  function onDown(y){ startY=y; dragging=true; facade.style.cursor='grabbing'; }
  function onMove(y){
    if(!dragging||startY===null) return;
    const delta = startY - y;
    if(delta>0){
      facade.style.transition='none';
      facade.style.transform = `translateY(${-delta}px) rotate(${-delta/18}deg)`;
      facade.style.opacity = Math.max(0.2, 1-delta/260);
    }
  }
  function onUp(y){
    if(!dragging) return;
    dragging=false;
    const delta = startY!==null && y!==null ? startY-y : 0;
    if(delta>70){ reveal(); }
    else{
      facade.style.transition='transform .25s ease, opacity .25s ease';
      facade.style.transform='translateY(0) rotate(0)';
      facade.style.opacity='1';
    }
    startY=null;
  }
  facade.addEventListener('touchstart', e=>onDown(e.touches[0].clientY), {passive:true});
  facade.addEventListener('touchmove', e=>onMove(e.touches[0].clientY), {passive:true});
  facade.addEventListener('touchend', e=>onUp(e.changedTouches[0].clientY));
  facade.addEventListener('mousedown', e=>onDown(e.clientY));
  window.addEventListener('mousemove', e=>{ if(dragging) onMove(e.clientY); });
  window.addEventListener('mouseup', e=>{ if(dragging) onUp(e.clientY); });
  // tap fallback (click)
  facade.addEventListener('click', ()=>{ if(!revealed && !dragging) reveal(); });
}

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
