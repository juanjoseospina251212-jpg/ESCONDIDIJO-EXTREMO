<style>
:root{
  --bg:#150a45; --bg2:#1b1056;
  --panel:#2c2872; --panel2:#3a3590; --panel-deep:#1a1450;
  --line:#5d59b8; --line-hi:#8f8ef0;
  --text:#ffffff; --dim:#bdb9ff;
  --pink:#ff5b82; --pink-dim:#5c1f3f;
  --cyan:#43ee95;            /* verde de acción */
  --gold:#ffc93c;
  --blue:#4cb4ff; --purple:#9a63ff;
  --bad:#ff6b8b; --good:#43ee95;
  --shadow:0 12px 26px rgba(8,2,40,.6);
  --radius:20px;
  --f-display:'Lilita One','Rix','Fredoka',sans-serif;
  --f-body:'Fredoka','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; color:var(--text); font-family:var(--f-body); font-weight:500; min-height:100%;
  background:linear-gradient(180deg,#3a22a0 0%,#25147a 38%,#150a45 100%) fixed;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overscroll-behavior:none; overflow-x:hidden;
}

/* =========================================================
   FONDO ESPACIAL: nebulosa, estrellas, planetas 3D, OVNI, cohete
   ========================================================= */
.space{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.nebula{position:absolute; inset:-10%; background:
  radial-gradient(ellipse 60% 40% at 15% 20%, rgba(255,90,200,.22), transparent 70%),
  radial-gradient(ellipse 55% 45% at 85% 70%, rgba(60,170,255,.22), transparent 70%),
  radial-gradient(ellipse 50% 35% at 50% 100%, rgba(150,90,255,.30), transparent 70%);}
#stars span{position:absolute; width:var(--s,2px); height:var(--s,2px); border-radius:50%; background:#fff;
  box-shadow:0 0 6px rgba(190,200,255,.9); opacity:.8;
  animation:twinkle var(--t,3s) ease-in-out infinite; animation-delay:var(--sd,0s);}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.8);} 50%{opacity:1; transform:scale(1.25);}}
.shoot{position:absolute; width:90px; height:2px; border-radius:2px; opacity:0;
  background:linear-gradient(90deg,#fff,rgba(255,255,255,0)); animation:shoot 9s ease-in infinite;}
.shoot.s1{top:12%; left:78%; animation-delay:2s;}
.shoot.s2{top:38%; left:96%; animation-delay:6.5s; width:70px;}
@keyframes shoot{
  0%{opacity:0; transform:translate(0,0) rotate(-30deg);}
  2%{opacity:1;}
  10%{opacity:0; transform:translate(-300px,173px) rotate(-30deg);}
  100%{opacity:0; transform:translate(-300px,173px) rotate(-30deg);}
}

.par{position:absolute;
  transform:translate3d(calc(var(--px,0)*var(--d,10)*1px), calc(var(--py,0)*var(--d,10)*1px), 0);
  transition:transform .3s ease-out;}
.par .float{position:relative; animation:planetFloat 9s ease-in-out infinite;}
@keyframes planetFloat{0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-12px) rotate(2deg);}}
.planet{position:relative; width:100%; aspect-ratio:1; border-radius:50%; overflow:hidden; z-index:1;}
.planet::before{content:''; position:absolute; inset:0; border-radius:50%;}
.ring{position:absolute; left:-32%; right:-32%; top:36%; bottom:36%; border-radius:50%;
  border:clamp(5px,1.3vw,9px) solid rgba(255,225,150,.62); transform:rotate(-20deg);
  box-shadow:0 0 18px rgba(255,200,100,.35);}
.ring-back{clip-path:inset(0 0 50% 0); z-index:0;}
.ring-front{clip-path:inset(50% 0 0 0); z-index:2;}

.p-a{top:-3vh; right:-12vw; width:clamp(130px,38vw,240px); --d:-22;}
.p-a .planet{
  background:radial-gradient(circle at 30% 28%,#ffe9a8 0%,#ffb84d 32%,#e9741f 66%,#8a3410 100%);
  box-shadow:inset -18px -20px 40px rgba(60,10,0,.6), inset 8px 8px 24px rgba(255,255,255,.25), 0 0 60px rgba(255,160,60,.35);}
.p-a .planet::before{background:repeating-linear-gradient(8deg,transparent 0 14px,rgba(120,40,0,.2) 14px 22px,transparent 22px 30px);}

.p-b{bottom:9vh; left:-14vw; width:clamp(110px,30vw,190px); --d:16;}
.p-b .float{animation-duration:11s; animation-delay:-3s;}
.p-b .planet{
  background:radial-gradient(circle at 32% 28%,#c9f4ff 0%,#5cc4ff 30%,#2f6fe6 62%,#16206e 100%);
  box-shadow:inset -16px -18px 36px rgba(5,5,60,.65), inset 8px 8px 20px rgba(255,255,255,.3), 0 0 50px rgba(80,170,255,.4);}
.p-b .planet::before{background:
  radial-gradient(ellipse 40% 14% at 62% 30%,rgba(255,255,255,.35),transparent 70%),
  radial-gradient(ellipse 34% 10% at 36% 58%,rgba(255,255,255,.28),transparent 70%),
  radial-gradient(ellipse 30% 9% at 70% 74%,rgba(255,255,255,.22),transparent 70%);}

.p-c{top:17vh; left:7vw; width:clamp(34px,9vw,58px); --d:32;}
.p-c .float{animation-duration:6s; animation-delay:-1s;}
.p-c .planet{
  background:radial-gradient(circle at 30% 28%,#ffd6e4 0%,#ff7aa6 40%,#a02a62 100%);
  box-shadow:inset -6px -7px 14px rgba(60,0,30,.55), 0 0 22px rgba(255,110,170,.45);}
.p-c .planet::before{background:
  radial-gradient(circle at 62% 56%,rgba(0,0,0,.2) 0 16%,transparent 17%),
  radial-gradient(circle at 30% 66%,rgba(0,0,0,.16) 0 11%,transparent 12%);}

.fly{position:absolute; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.ufo{top:24vh; left:-90px; width:64px; animation:ufoFly 30s linear infinite 3s;}
@keyframes ufoFly{
  0%{transform:translate(0,0) rotate(-4deg);}
  25%{transform:translate(32vw,-14px) rotate(4deg);}
  50%{transform:translate(64vw,12px) rotate(-4deg);}
  100%{transform:translate(125vw,-8px) rotate(3deg);}
}
.rocket{bottom:-100px; left:18vw; width:40px; animation:rocketFly 40s linear infinite 12s;}
@keyframes rocketFly{
  0%{transform:translate(0,0) rotate(30deg);}
  100%{transform:translate(72vw,-130vh) rotate(30deg);}
}
.flame{transform-box:fill-box; transform-origin:50% 0; animation:flame .14s ease-in-out infinite alternate;}
@keyframes flame{from{transform:scaleY(.8);} to{transform:scaleY(1.2);}}

/* =========================================================
   LAYOUT BASE
   ========================================================= */
.digits{font-family:var(--f-display); font-weight:400; letter-spacing:1px;}
h1,h2,h3,.display{font-family:var(--f-display); font-weight:400; letter-spacing:.5px; line-height:1.08;}
.brand-font{font-family:var(--f-display) !important; letter-spacing:1px;}
.app{position:relative; z-index:1; max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
main{flex:1; padding:70px 16px 120px; position:relative; overflow-x:clip;}
main > *{animation:screenIn .24s ease;}
@keyframes screenIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Títulos de pantalla = cinta rosa */
main h2{
  position:relative; isolation:isolate; display:block; width:fit-content; max-width:88%;
  margin:8px auto 20px; padding:9px 26px 11px; text-align:center;
  font-size:clamp(20px,6vw,28px); color:#fff; text-shadow:0 2px 0 rgba(90,0,30,.55);
  background:linear-gradient(180deg,#ff7d9b 0%,#ff4a74 55%,#e12a5a 100%);
  border:3px solid #9b1b43; border-radius:8px;
  box-shadow:0 5px 0 #8a1238, 0 10px 18px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.5);
}
main h2::before, main h2::after{
  content:''; position:absolute; top:12px; width:36px; height:100%; z-index:-1;
  background:linear-gradient(180deg,#d8305d,#a81745); border:3px solid #7e1038;
}
main h2::before{left:-26px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%);}
main h2::after{right:-26px; clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%);}
main .momento h2{
  display:block; width:auto; max-width:none; margin:6px 0; padding:0; background:none; border:0; border-radius:0;
  box-shadow:none; text-shadow:0 4px 0 #8a4a00, 0 0 24px rgba(255,200,60,.55); color:var(--gold);
}
main .momento h2::before, main .momento h2::after{display:none;}

/* =========================================================
   BOTONES GELATINA 3D
   ========================================================= */
.btn{
  --c1:#7fd3ff; --c2:#3b7bff; --edge:#2347b8; --ink:#fff; --ink-sh:rgba(10,20,90,.55);
  position:relative; isolation:isolate; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 18px 16px; margin-top:14px;
  border-radius:18px; border:3px solid var(--edge); cursor:pointer;
  font-family:var(--f-display); font-weight:400; font-size:clamp(16px,4.6vw,19px);
  line-height:1.1; letter-spacing:.4px; text-align:center;
  color:var(--ink); text-shadow:0 2px 0 var(--ink-sh);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:0 6px 0 var(--edge), 0 12px 18px rgba(5,0,40,.45), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -5px 0 rgba(0,0,0,.14);
  transition:transform .09s ease, box-shadow .09s ease, filter .15s ease;
  -webkit-user-select:none; user-select:none;
}
.btn::before{
  content:''; position:absolute; left:10px; right:10px; top:4px; height:38%; z-index:-1;
  border-radius:12px 12px 22px 22px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04)); pointer-events:none;
}
.btn:hover{filter:brightness(1.07);}
.btn:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 var(--edge), 0 4px 8px rgba(5,0,40,.45), inset 0 3px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.14);
}
.btn.bounce-release{animation:btnBoing .45s cubic-bezier(.34,1.8,.56,1);}
@keyframes btnBoing{0%{transform:translateY(5px);} 45%{transform:translateY(-4px);} 100%{transform:translateY(0);}}
.btn-primary{--c1:#ffe063; --c2:#ff9a1f; --edge:#b85a06; --ink:#4d2300; --ink-sh:rgba(255,255,255,.45);}
.btn-secondary{--c1:#7fd3ff; --c2:#3b7bff; --edge:#2347b8;}
.btn-cyan{--c1:#8bffb3; --c2:#22c761; --edge:#12803e; --ink:#06381b; --ink-sh:rgba(255,255,255,.4);}
.btn-gold{--c1:#fff59a; --c2:#ffc41f; --edge:#a8740a; --ink:#4a3200; --ink-sh:rgba(255,255,255,.5);}
.btn-ghost{
  background:rgba(255,255,255,.07); color:var(--dim); text-shadow:none; box-shadow:none;
  border:2px dashed rgba(170,165,255,.45); padding:13px 18px;
}
.btn-ghost::before{display:none;}
.btn-ghost:hover{filter:none; background:rgba(255,255,255,.12);}
.btn-ghost:active{transform:scale(.98); box-shadow:none;}
.btn:disabled{opacity:.42; filter:grayscale(.6); cursor:not-allowed; pointer-events:none;}
.btn small{font-weight:400; opacity:.85; font-size:.8em;}
:focus-visible{outline:3px solid #6fe2ff; outline-offset:2px;}

/* =========================================================
   PANELES SCI-FI CON REMACHES
   ========================================================= */
.card-box{
  position:relative; margin-bottom:18px; padding:22px 16px 16px; border-radius:22px; color:var(--text);
  background:
    radial-gradient(circle at 14px 14px,#a9a7f2 0 2.2px,transparent 3px),
    radial-gradient(circle at calc(100% - 14px) 14px,#a9a7f2 0 2.2px,transparent 3px),
    radial-gradient(circle at 14px calc(100% - 14px),#a9a7f2 0 2.2px,transparent 3px),
    radial-gradient(circle at calc(100% - 14px) calc(100% - 14px),#a9a7f2 0 2.2px,transparent 3px),
    linear-gradient(180deg,#3b3786 0%,#2a2669 100%);
  border:3px solid #5f5bbd;
  box-shadow:0 6px 0 #1a1550, 0 14px 26px rgba(5,0,40,.5), inset 0 0 0 3px #1f1b5a, inset 0 2px 8px rgba(255,255,255,.12);
}
.card-box::before{
  content:''; position:absolute; top:-10px; left:50%; width:84px; height:14px; transform:translateX(-50%);
  border-radius:8px 8px 4px 4px; background:linear-gradient(180deg,#ffc84a,#ff9a24);
  border:2px solid #b85a06; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.card-box h3{margin:0 0 10px; font-size:22px; color:var(--text);}
.section-title{font-family:var(--f-display); font-size:15px; letter-spacing:1px; color:#ffd870; margin:22px 0 10px; text-transform:uppercase;}

input[type=text]{
  width:100%; padding:14px 16px; border-radius:16px; border:3px solid #5f5bbd;
  background:#15103f; color:#fff; font-size:16px; font-family:var(--f-body); font-weight:600;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.5);
}
input[type=text]::placeholder{color:#8a86d8;}
input[type=text]:focus{outline:none; border-color:#6fe2ff; box-shadow:inset 0 4px 8px rgba(0,0,0,.5), 0 0 0 3px rgba(111,226,255,.28), 0 0 18px rgba(111,226,255,.45);}

/* filas (jugadores / ronda / ranking) */
.player-row,.player-round-row,.leader-row{
  display:flex; align-items:center; gap:10px; padding:11px 14px; margin-bottom:12px; border-radius:18px;
  background:linear-gradient(180deg,#2b2770,#201c58); border:3px solid #4f4bab;
  box-shadow:0 4px 0 #15103f, inset 0 2px 0 rgba(255,255,255,.1);
}
.leader-row{gap:12px;}
.player-row .avatar,.pin-avatar,.pin-avatar-fallback{width:46px; height:46px; border-radius:50%; flex-shrink:0; object-fit:cover; border:3px solid #8f8ef0; box-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 14px rgba(143,142,240,.4);}
.pr-avatar,.pr-avatar-fallback{width:36px; height:36px; border-radius:50%; flex-shrink:0; object-fit:cover; border:3px solid #8f8ef0; box-shadow:0 2px 0 rgba(0,0,0,.35);}
.player-row .avatar:not(img),.pin-avatar-fallback,.pr-avatar-fallback{
  background:linear-gradient(135deg,var(--pink),var(--purple)); display:flex; align-items:center; justify-content:center;
  font-family:var(--f-display); font-weight:400; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.player-row .avatar-wrap{position:relative; flex-shrink:0;}
.player-row .cam-badge{position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%; background:var(--panel2); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer;}
.player-row .name,.player-round-row .name{flex:1; font-weight:600; font-size:17px; min-width:0; overflow-wrap:anywhere;}
.player-round-row .actions{display:flex; gap:6px;}
.player-row .icon-btn{
  width:38px; height:38px; border-radius:12px; font-size:17px; cursor:pointer; padding:0;
  background:linear-gradient(180deg,#5a56c8,#3b37a0); border:2px solid #25217a; color:#fff;
  box-shadow:0 3px 0 #1a1550, inset 0 2px 0 rgba(255,255,255,.3); transition:transform .08s, box-shadow .08s;
}
.player-row .icon-btn:active{transform:translateY(3px); box-shadow:0 0 0 #1a1550;}
.mini-btn{padding:8px 10px; border-radius:10px; border:none; font-size:12px; font-weight:700; cursor:pointer;}
.mini-btn.find{background:var(--panel2); color:var(--text);}
.mini-btn.lib{background:linear-gradient(135deg,var(--cyan),#1bc2ab); color:#00251f;}

.status-pill{
  font-family:var(--f-display); font-weight:400; font-size:12px; letter-spacing:.4px; text-transform:uppercase;
  padding:4px 10px 5px; border-radius:10px; border:2px solid rgba(0,0,0,.35); color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.4);
  box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4); white-space:nowrap;
}
.status-hidden{background:linear-gradient(180deg,#7bb8ff,#3f74e8);}
.status-found{background:linear-gradient(180deg,#ff8aa3,#e03060);}
.status-liberated{background:linear-gradient(180deg,#7dffb0,#1fb85a); color:#06381b; text-shadow:none;}
.extreme-tag{background:linear-gradient(180deg,#ffe063,#ff9a1f); color:#4d2300; font-family:var(--f-display); font-size:11px; padding:2px 8px 3px; border-radius:10px; margin-left:6px; border:2px solid #b85a06;}

/* =========================================================
   PORTADA
   ========================================================= */
.hero{text-align:center; padding:2vh 6px 24px; overflow-x:clip;}
.marquee-lights{display:flex; justify-content:center; gap:10px; margin:0 0 4px;}
.marquee-lights span{
  width:14px; height:14px; background:var(--gold); filter:drop-shadow(0 0 6px rgba(255,201,60,.95)); animation:blink 1.6s infinite;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.marquee-lights span:nth-child(odd){animation-delay:.4s; background:var(--pink); filter:drop-shadow(0 0 6px rgba(255,91,130,.95));}
.marquee-lights span:nth-child(3n){animation-delay:.8s; background:#6fe2ff; filter:drop-shadow(0 0 6px rgba(111,226,255,.95));}
@keyframes blink{0%,100%{opacity:.35; transform:scale(.85);} 50%{opacity:1; transform:scale(1.1);}}
.mascot{width:min(190px,52vw); margin:8px auto 0; animation:mascotFloat 4s ease-in-out infinite; filter:drop-shadow(0 16px 16px rgba(0,0,0,.4));}
.mascot svg{display:block; width:100%; height:auto; overflow:visible;}
.mascot .eye{transform-box:fill-box; transform-origin:center; animation:eyeBlink 5s infinite;}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.1);}}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-1.5deg);} 50%{transform:translateY(-12px) rotate(1.5deg);}}
.mascot-shadow{width:110px; height:14px; margin:2px auto 0; border-radius:50%; background:radial-gradient(ellipse,rgba(67,230,255,.55),transparent 70%); animation:shadowPulse 4s ease-in-out infinite;}
@keyframes shadowPulse{0%,100%{transform:scale(1); opacity:.9;} 50%{transform:scale(.72); opacity:.5;}}
.game-logo{margin:12px 0 0; display:flex; flex-direction:column; align-items:center;}
.game-logo .l1,.game-logo .l2{display:block; line-height:.95; letter-spacing:1px; white-space:nowrap; padding:0 .08em;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;}
.game-logo .l1{
  font-size:clamp(40px,14.5vw,76px);
  background-image:linear-gradient(180deg,#d8fbff 0%,#5ee7ff 45%,#2f8bff 100%);
  -webkit-text-stroke:3px #1a2f96;
  filter:drop-shadow(0 4px 0 #15267a) drop-shadow(0 8px 0 #101c5c) drop-shadow(0 16px 14px rgba(0,0,0,.45));
}
.game-logo .l2{
  font-size:clamp(26px,9vw,46px); margin-top:8px;
  background-image:linear-gradient(180deg,#ffffff 0%,#d9d4ff 55%,#a99bff 100%);
  -webkit-text-stroke:2.5px #4a2fa0;
  filter:drop-shadow(0 3px 0 #2e1a80) drop-shadow(0 6px 0 #1f1163) drop-shadow(0 12px 12px rgba(0,0,0,.45));
}
.hero .tag{
  display:inline-block; margin-top:20px; padding:7px 16px 8px; border-radius:30px; font-size:14px; color:#e9e6ff;
  background:rgba(20,10,70,.65); border:2px solid #5f5bbd; box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
}
.save-chip{display:block; width:fit-content; margin:12px auto 0; padding:5px 14px 6px; border-radius:20px; font-size:13px; font-weight:600; color:#06381b;
  background:linear-gradient(180deg,#8bffb3,#22c761); border:2px solid #12803e; box-shadow:0 3px 0 #12803e;}
.hero-btns{max-width:420px; margin:22px auto 0;}

/* =========================================================
   PANTALLA DE RONDA
   ========================================================= */
.round-header{
  position:relative; display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin:14px 0 18px; padding:16px 16px 12px; border-radius:20px;
  background:linear-gradient(180deg,#3b3786,#26226a); border:3px solid #5f5bbd;
  box-shadow:0 5px 0 #1a1550, 0 12px 22px rgba(5,0,40,.5), inset 0 0 0 3px #1f1b5a;
}
.round-header::before{
  content:'MISIÓN'; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  padding:2px 18px 3px; font-family:var(--f-display); font-size:12px; letter-spacing:1px; color:#4d2300;
  background:linear-gradient(#ffe063,#ff9a1f); border:2px solid #b85a06; border-radius:10px; box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.round-header .r{font-size:32px; color:#ffd870; text-shadow:0 3px 0 #9a4c05;}
.round-header .meta{text-align:right; font-size:13px; color:var(--dim); line-height:1.35;}
.round-header .meta b{color:var(--text); display:block; font-size:16px;}
.hud{margin:0 0 18px; padding:12px 14px; border-radius:18px; background:#1a1450; border:3px solid #4f4bab; box-shadow:inset 0 4px 8px rgba(0,0,0,.4);}
.hud-chips{display:flex; gap:8px; margin-bottom:10px;}
.chip{flex:1; text-align:center; padding:5px 4px 6px; border-radius:12px; font-family:var(--f-display); font-size:18px; color:#fff;
  border:2px solid rgba(0,0,0,.3); box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4); text-shadow:0 1px 0 rgba(0,0,0,.4);}
.chip-blue{background:linear-gradient(#7bb8ff,#3f74e8);}
.chip-pink{background:linear-gradient(#ff8aa3,#e03060);}
.chip-green{background:linear-gradient(#7dffb0,#1fb85a); color:#06381b; text-shadow:none;}
.meter,.leader-row .bar{height:20px; border-radius:12px; background:#0f0a33; border:3px solid #4f4bab; box-shadow:inset 0 3px 6px rgba(0,0,0,.6); overflow:hidden; position:relative;}
.meter-fill,.leader-row .bar > div{
  position:relative; overflow:hidden; height:100%; border-radius:8px;
  background:linear-gradient(180deg,#c28bff,#7b3fe6); box-shadow:inset 0 3px 0 rgba(255,255,255,.45), 0 0 12px rgba(155,99,255,.8);
  transition:width .6s cubic-bezier(.3,1.3,.5,1);
}
.meter-fill::after,.leader-row .bar > div::after{content:''; position:absolute; inset:0; background:repeating-linear-gradient(115deg,rgba(255,255,255,.2) 0 8px,transparent 8px 16px); animation:stripes 1.2s linear infinite;}
@keyframes stripes{to{background-position:32px 0;}}
.hud-cap{margin-top:8px; font-size:12.5px; color:var(--dim); text-align:center;}

/* ranking */
.leader-row .rank{font-family:var(--f-display); font-size:22px; width:32px; color:var(--dim); text-align:center;}
.leader-row .info{flex:1; min-width:0;}
.leader-row .info .top{display:flex; justify-content:space-between; align-items:center; font-weight:600; gap:8px; font-size:17px;}
.leader-row .info .top .pts{font-family:var(--f-display); color:var(--gold); font-size:20px; flex-shrink:0; text-shadow:0 2px 0 #8a4a00;}
.leader-row .bar{height:14px; margin-top:7px; border-width:2px;}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
.topbar{
  display:none; padding:12px 20px; align-items:center; justify-content:space-between; gap:12px;
  position:sticky; top:0; z-index:30; background:rgba(21,10,69,.88); backdrop-filter:blur(8px);
  border-bottom:3px solid #5f5bbd; box-shadow:0 6px 18px rgba(5,0,40,.5);
}
.topbar .brand{font-size:26px; color:var(--gold); text-shadow:0 3px 0 #8a4a00;}
.topnav{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.topnav button{
  font-family:var(--f-display); font-size:13px; padding:7px 12px 8px; border-radius:12px; cursor:pointer; color:#fff;
  background:linear-gradient(180deg,#7fd3ff,#3b7bff); border:2px solid #2347b8; box-shadow:0 3px 0 #2347b8, inset 0 2px 0 rgba(255,255,255,.5);
  text-shadow:0 1px 0 rgba(10,20,90,.5); transition:transform .08s, box-shadow .08s;
}
.topnav button:active{transform:translateY(3px); box-shadow:0 0 0 #2347b8;}
.topnav button.active{background:linear-gradient(180deg,#ffe063,#ff9a1f); border-color:#b85a06; box-shadow:0 3px 0 #b85a06, 0 0 14px rgba(255,200,60,.7), inset 0 2px 0 rgba(255,255,255,.6); color:#4d2300; text-shadow:none;}

.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:40; max-width:720px; margin:0 auto;
  display:flex; justify-content:space-between; gap:5px; padding:12px 8px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(21,10,69,.93); backdrop-filter:blur(8px); border-top:3px solid #5f5bbd; border-radius:22px 22px 0 0;
  box-shadow:0 -8px 24px rgba(5,0,40,.55);
}
.bottomnav:empty{display:none;}
.bottomnav button{
  flex:1 1 0; min-width:0; max-width:66px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 2px 5px;
  border-radius:15px; border:2px solid #2347b8; cursor:pointer; color:#fff; font-family:'Fredoka','Inter',system-ui,sans-serif; font-weight:700; font-size:8.5px; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:clip;
  background:linear-gradient(180deg,#7fd3ff,#3b7bff); box-shadow:0 4px 0 #2347b8, inset 0 2px 0 rgba(255,255,255,.55);
  text-shadow:0 1px 0 rgba(10,20,90,.5); transition:transform .1s ease, box-shadow .1s ease;
}
.bottomnav button .ic{font-size:20px; line-height:1;}
.bottomnav button:active{transform:translateY(3px); box-shadow:0 1px 0 #2347b8, inset 0 2px 0 rgba(255,255,255,.55);}
.bottomnav button.active{
  background:linear-gradient(180deg,#ffe063,#ff9a1f); border-color:#b85a06; color:#4d2300; text-shadow:none;
  transform:translateY(-7px); box-shadow:0 4px 0 #b85a06, 0 0 18px rgba(255,200,60,.85), inset 0 2px 0 rgba(255,255,255,.6);
}

.sound-toggle-fab,.music-fab{
  position:fixed; top:14px; z-index:50; width:44px; height:44px; border-radius:50%; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:#fff;
  background:linear-gradient(180deg,#7fd3ff,#3b7bff); border:3px solid #2347b8; box-shadow:0 4px 0 #2347b8, inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .08s, box-shadow .08s, opacity .2s;
}
.sound-toggle-fab{right:14px;}
.music-fab{right:66px;}
.music-fab.off{opacity:.6; filter:grayscale(.5);}
.sound-toggle-fab:active,.music-fab:active{transform:translateY(3px); box-shadow:0 1px 0 #2347b8;}

.next-fab,#nextRoundFab{
  position:fixed; right:14px; bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:60;
  display:flex; align-items:center; gap:8px; padding:14px 22px 16px; border-radius:30px; cursor:pointer;
  font-family:var(--f-display); font-size:17px; color:#4d2300; text-shadow:0 2px 0 rgba(255,255,255,.45);
  background:linear-gradient(180deg,#ffe063,#ff9a1f); border:3px solid #b85a06;
  box-shadow:0 6px 0 #b85a06, 0 12px 24px rgba(255,150,30,.5), inset 0 3px 0 rgba(255,255,255,.6);
  animation:fabpulse 1.8s ease-in-out infinite;
}
#nextRoundFab{display:none;}
.next-fab:active,#nextRoundFab:active{transform:translateY(4px); box-shadow:0 2px 0 #b85a06;}
@keyframes fabpulse{0%,100%{box-shadow:0 6px 0 #b85a06, 0 12px 24px rgba(255,150,30,.45), inset 0 3px 0 rgba(255,255,255,.6);} 50%{box-shadow:0 6px 0 #b85a06, 0 12px 38px rgba(255,190,50,.95), inset 0 3px 0 rgba(255,255,255,.6);}}

/* =========================================================
   MODALES
   ========================================================= */
.overlay{
  position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(40,20,120,.55),rgba(4,0,25,.88)); backdrop-filter:blur(5px);
  animation:ovIn .2s ease;
}
@keyframes ovIn{from{opacity:0;} to{opacity:1;}}
.overlay.center{align-items:center; padding:16px;}
.sheet{
  position:relative; width:100%; max-width:720px; max-height:88vh; overflow-y:auto; padding:22px 18px 22px;
  border-radius:26px 26px 0 0; border:4px solid #79c4ff; border-bottom:none;
  background:linear-gradient(180deg,#34308a 0%,#221e5e 100%);
  box-shadow:0 -10px 40px rgba(0,0,0,.55), 0 0 30px rgba(90,180,255,.35), inset 0 3px 0 rgba(255,255,255,.25);
  animation:sheetUp .32s cubic-bezier(.2,1.15,.4,1);
}
@keyframes sheetUp{from{transform:translateY(60px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes popIn{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
.overlay.center .sheet{border-radius:26px; border-bottom:4px solid #79c4ff; animation:popIn .3s cubic-bezier(.2,1.4,.4,1);}
.sheet h3{font-size:24px; text-align:center; margin:4px 0 12px; text-shadow:0 3px 0 rgba(0,0,0,.35);}
.sheet p{line-height:1.45;}
.sheet .close-row{display:flex; justify-content:flex-end; margin:-6px -4px 0 0;}
.sheet .x{
  width:36px; height:36px; border-radius:50%; cursor:pointer; color:#fff; font-size:15px; font-family:var(--f-display);
  background:linear-gradient(#7fd3ff,#3b7bff); border:3px solid #2347b8; box-shadow:0 3px 0 #2347b8, inset 0 2px 0 rgba(255,255,255,.6);
}
.sheet .x:active{transform:translateY(3px); box-shadow:0 0 0 #2347b8;}

/* carta secreta */
.facade-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 20px; touch-action:none;}
.facade-stage{position:relative; width:240px; height:340px; perspective:1000px;}
.facade{
  position:absolute; inset:0; border-radius:24px; cursor:grab; will-change:transform; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:
    radial-gradient(circle at 30% 18%,rgba(255,255,255,.3),transparent 45%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px),
    linear-gradient(150deg,#6a4bff,#2b1a9a 60%,#1b0f6a);
  border:4px solid #8fd0ff;
  box-shadow:0 18px 36px rgba(0,0,0,.55), 0 0 30px rgba(110,190,255,.5), inset 0 3px 0 rgba(255,255,255,.35);
}
.facade::after{content:''; position:absolute; top:-50%; left:-60%; width:40%; height:200%; transform:rotate(20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shine 3.4s ease-in-out infinite;}
@keyframes shine{0%{left:-60%;} 60%,100%{left:140%;}}
.facade .big{font-size:60px; filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
.facade .who{font-family:var(--f-display); font-size:28px; color:#ffe36e; text-shadow:0 3px 0 #7a3f00;}
.facade .hint{color:#dcd9ff; font-size:12.5px; text-align:center; padding:0 20px; font-weight:600;}
.facade .arrow{font-size:26px; color:#6fe2ff; animation:bob 1.4s infinite;}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);}}
.card-face{
  position:absolute; inset:0; border-radius:24px; padding:24px 20px; overflow:hidden; border:4px solid;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
  animation:cardPop .5s cubic-bezier(.2,1.5,.4,1);
  box-shadow:0 18px 36px rgba(0,0,0,.55), inset 0 3px 0 rgba(255,255,255,.3);
}
@keyframes cardPop{from{transform:scale(.8) rotate(-5deg); opacity:0;} to{transform:scale(1) rotate(0); opacity:1;}}
.card-face.good{background:linear-gradient(160deg,#2fd27a,#0e6b3f); border-color:#8bffbd; box-shadow:0 18px 36px rgba(0,0,0,.55), 0 0 36px rgba(80,255,150,.55), inset 0 3px 0 rgba(255,255,255,.3);}
.card-face.bad{background:linear-gradient(160deg,#ff6b8f,#7a1445); border-color:#ffb0c6; box-shadow:0 18px 36px rgba(0,0,0,.55), 0 0 36px rgba(255,100,150,.55), inset 0 3px 0 rgba(255,255,255,.3);}
.card-face .tag{font-size:42px; filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));}
.card-face .title{font-family:var(--f-display); font-size:26px; text-shadow:0 3px 0 rgba(0,0,0,.35); line-height:1.05;}
.card-face .body{font-size:14px; line-height:1.45; color:#fff; font-weight:500;}

/* ruleta */
.wheel-wrap{display:flex; flex-direction:column; align-items:center; padding:24px 0;}
.wheel-outer{position:relative; margin:18px auto;}
.wheel-outer::before{
  content:''; position:absolute; inset:-17px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#ffe27a 0deg 6deg,#ff5b82 6deg 12deg,#6c3be0 12deg 30deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 15px),#000 calc(100% - 14px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 15px),#000 calc(100% - 14px));
  animation:spinSlow 26s linear infinite; filter:drop-shadow(0 0 12px rgba(255,200,80,.7));
}
@keyframes spinSlow{to{transform:rotate(360deg);}}
.wheel{
  width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden; border:8px solid #2a2669;
  box-shadow:0 0 0 4px #8f8ef0, 0 0 50px rgba(120,100,255,.55), inset 0 0 30px rgba(0,0,0,.5);
  transition:transform 4s cubic-bezier(.15,.85,.25,1);
}
.wheel-pointer{position:absolute; top:-32px; left:50%; transform:translateX(-50%); z-index:6; width:40px; filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));}
.wheel-pointer svg{display:block; width:100%; height:auto;}
.wheel-center{
  position:absolute; top:50%; left:50%; width:64px; height:64px; margin:-32px 0 0 -32px; z-index:4; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe36e,#ff9a1f 70%); border:4px solid #b85a06;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:26px;
}
.result-badge{text-align:center; margin-top:14px;}
.result-badge .label{color:var(--dim); font-size:14px; letter-spacing:1px; font-weight:600;}
.result-badge .value{font-family:var(--f-display); font-size:48px; color:var(--gold); text-shadow:0 4px 0 #8a4a00, 0 0 26px rgba(255,200,60,.55); animation:popIn .5s cubic-bezier(.2,1.5,.4,1);}

/* temporizador / historial / stats / ajustes */
.timer-box{display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 0;}
.timer-display{font-family:var(--f-display); font-size:80px; color:var(--gold); text-shadow:0 5px 0 #8a4a00, 0 0 30px rgba(255,200,60,.4);}
.timer-presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.timer-presets button{padding:10px 16px; border-radius:12px; border:2px solid #25217a; background:linear-gradient(#5a56c8,#3b37a0); color:#fff; font-family:var(--f-display); cursor:pointer; box-shadow:0 3px 0 #1a1550;}
.timer-controls{display:flex; gap:10px;}
.timer-controls button{flex:1;}
.hist-round{margin-bottom:16px; padding:14px 14px 10px; border-radius:18px; background:rgba(26,20,80,.7); border:3px solid #4f4bab;}

<script>
/* =========================================================
   ESCONDIDIJO EXTREMO — LÓGICA COMPLETA
   ========================================================= */

const CARDS = [
  {id:1, type:'good', title:'SEGUNDO ESCONDITE', emoji:'🟢', text:'Si te encuentran, tienes 15 segundos para encontrar un nuevo escondite. Durante esos 15 segundos, el Buscador NO puede perseguirte. Cuando encuentres tu nuevo escondite, debes permanecer allí.'},
  {id:2, type:'bad', title:'ESTATUA', emoji:'🔴', text:'Cuando te encuentren, debes quedarte completamente quieto durante 5 segundos. Después puedes intentar liberarte normalmente.'},
  {id:3, type:'bad', title:'GRITO EXTREMO', emoji:'🔴', text:'Mientras estés escondido, debes gritar tu nombre durante 5 segundos para darle una pista al Buscador. Después puedes quedarte escondido o cambiar de posición.'},
  {id:4, type:'bad', title:'CAMINO LENTO', emoji:'🔴', text:'Durante 10 segundos no puedes correr. Puedes caminar normalmente e intentar escapar.'},
  {id:5, type:'bad', title:'CAMBIO OBLIGATORIO', emoji:'🔴', text:'Debes abandonar tu escondite y encontrar otro en 10 segundos. El Buscador no puede perseguirte durante los primeros 3 segundos.'},
  {id:6, type:'bad', title:'ESCÓNDETE OTRA VEZ', emoji:'🔴', text:'Cuando te encuentren, tienes 10 segundos para buscar otro escondite. El Buscador puede perseguirte. Si consigues esconderte sin que vuelva a encontrarte, quedas libre.'},
  {id:7, type:'bad', title:'SONIDO EXTRAÑO', emoji:'🔴', text:'Mientras estés escondido, debes hacer durante 3 segundos un sonido extraño que no sea un grito normal (MEOWWW, GÑÑÑÑ, BRRRRR, PI PI PI...). No puedes gritar "AAAAAA" ni decir una palabra normal. Después puedes quedarte escondido o cambiar de posición.'},
  {id:8, type:'bad', title:'PAUSA', emoji:'🔴', text:'Cuando te encuentren, debes esperar 5 segundos antes de poder moverte. Después puedes intentar escapar normalmente.'},
  {id:9, type:'bad', title:'DOS CAMINOS', emoji:'🔴', text:'Cuando te encuentren debes elegir: A) Esperar 5 segundos antes de moverte. B) Salir inmediatamente, pero durante los primeros 5 segundos solo puedes caminar. Tú decides qué opción te conviene más.'},
  {id:10, type:'bad', title:'VUELTA ATRÁS', emoji:'🔴', text:'Cuando te encuentren, debes retroceder hasta un punto que elijas antes de poder escapar. Puedes elegir el camino que quieras para llegar hasta allí.'},
  {id:11, type:'bad', title:'ÚLTIMO INTENTO', emoji:'🔴', text:'Cuando te encuentren tienes 5 segundos para elegir: ESCAPAR (correr inmediatamente hacia el Punto de Liberación) o ESCONDERTE (encontrar un escondite cercano y permanecer allí durante 10 segundos).'}
];

const SAVE_KEY = 'escondidijo_extremo_save_v1';

function freshState(){
  return {
    screen:'home',
    players:[], // {id,name,points,liberations,foundCount,rescues,rescuedCount,streak,extremeMode,extremeRoundsLeft,lastLiberationBonusAt}
    round:0,
    currentSearcherId:null,
    lastSearcherId:null,
    liberationPoint:'',
    roundData:null, // {statuses:{id:'hidden'|'found'|'liberated'}, cards:{id:cardId}, firstLiberatorId, rescuedThisRound:Set, lastFoundId}
    rescueLocks:{}, // liberatorId -> {targetId: roundsLeft}
    finalHunt:{active:false, triggerRound:null},
    winner:null,
    history:[], // round summaries
    tempSelectedPlayer:null,
    pendingNextRound:false,
    stats:{},
    settings:{sound:true, animations:true, music:false},
    undoStack:[],
    _timer:{seconds:0, running:false, initial:0}
  };
}

const _loadedSave = loadFromStorage();
let state = _loadedSave || freshState();
if(_loadedSave) saveGame();
let audioCtx = null;
let wheelLocked = false; // nunca se guarda: se resetea siempre al entrar a la ruleta

/* ---------------- persistence ---------------- */
function saveGame(){
  try{
    const { undoStack, _timer, ...toSave } = state;
    localStorage.setItem(SAVE_KEY, JSON.stringify(toSave));
  }catch(e){ console.warn('No se pudo guardar', e); }
}
function loadFromStorage(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    data.undoStack = [];
    data._timer = {seconds:0, running:false, initial:0};
    return data;
  }catch(e){ return null; }
}
function loadGame(){
  const s = loadFromStorage();
  if(s){ state = s; render(); showToast('Partida cargada'); }
}
function deleteSave(){
  localStorage.removeItem(SAVE_KEY);
  state = freshState();
  render();
}

/* ---------------- undo ---------------- */
function pushUndo(){
  const { undoStack: _u, _timer: _t, ...rest } = state;
  const snap = JSON.stringify(rest);
  state.undoStack = state.undoStack || [];
  state.undoStack.push(snap);
  if(state.undoStack.length > 12) state.undoStack.shift();
}
function undoLastAction(){
  if(!state.undoStack || state.undoStack.length===0){ showToast('Nada que deshacer'); return; }
  const prev = state.undoStack.pop();
  const stack = state.undoStack;
  state = JSON.parse(prev);
  state.undoStack = stack;
  state._timer = {seconds:0, running:false, initial:0};
  saveGame();
  render();
  showToast('Acción deshecha ↩️');
}

/* ---------------- sound (Web Audio API) ---------------- */
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx,freq,start,dur,type='sine',gain=0.18,dest){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const t0 = ctx.currentTime+start;
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(dest||ctx.destination);
  o.start(t0);
  o.stop(t0+dur+0.05);
}
/* barrido de frecuencia: láseres, whoosh, subidas y bajadas */
function sweep(ctx,f0,f1,start,dur,type='sine',gain=0.15){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const t0 = ctx.currentTime+start;
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0);
  o.stop(t0+dur+0.05);
}
function noiseBurst(ctx,start,dur,gain=0.12){
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const src = ctx.createBufferSource(); src.buffer=buffer;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain, ctx.currentTime+start);
  src.connect(g); g.connect(ctx.destination);
  src.start(ctx.currentTime+start);
}
/* destellos tipo "estrella conseguida" */
function sparkle(ctx,start,base=1200,n=4,gain=0.06){
  for(let i=0;i<n;i++) tone(ctx, base*Math.pow(1.25,i)*(i%2?1.5:1), start+i*0.055, 0.2, 'sine', gain);
}
function playUiSound(kind){
  if(!state.settings.sound) return;
  const ctx = ensureAudio(); if(!ctx) return;
  if(kind==='click'){ sweep(ctx,520,900,0,0.07,'square',0.06); tone(ctx,1320,0.04,0.07,'triangle',0.05); }
  else if(kind==='nav'){ tone(ctx,660,0,0.07,'triangle',0.1); tone(ctx,990,0.05,0.1,'triangle',0.08); }
  else if(kind==='back'){ sweep(ctx,620,330,0,0.11,'triangle',0.1); }
  else if(kind==='start'){ sweep(ctx,280,880,0,0.14,'sawtooth',0.05); [523,659,784].forEach((f,i)=>tone(ctx,f,0.04+i*0.05,0.14,'triangle',0.1)); }
  else if(kind==='confirm'){ tone(ctx,700,0,0.07,'square',0.06); tone(ctx,1050,0.06,0.14,'triangle',0.1); }
  else if(kind==='open'){ sweep(ctx,200,1200,0,0.26,'sine',0.09); sparkle(ctx,0.18,1500,3,0.05); }
  else if(kind==='shutter'){ noiseBurst(ctx,0,0.05,0.22); noiseBurst(ctx,0.08,0.09,0.16); tone(ctx,1800,0.02,0.05,'square',0.06); }
  else if(kind==='coin'){ tone(ctx,988,0,0.07,'square',0.07); tone(ctx,1319,0.07,0.35,'square',0.07); }
  else if(kind==='error'){ sweep(ctx,240,110,0,0.28,'sawtooth',0.1); }
  else if(kind==='point'){ tone(ctx,988,0,0.07,'square',0.07); tone(ctx,1319,0.07,0.28,'square',0.07); sparkle(ctx,0.1,1700,3,0.04); }
  else if(kind==='liberate'){ tone(ctx,660,0,0.1,'sine',0.15); tone(ctx,990,0.09,0.2,'sine',0.15); sparkle(ctx,0.16,1600,3,0.05); }
  else if(kind==='rescue'){ tone(ctx,520,0,0.1,'sine',0.15); tone(ctx,780,0.08,0.1,'sine',0.15); tone(ctx,1040,0.16,0.2,'sine',0.15); sparkle(ctx,0.26,1400,4,0.05); }
  else if(kind==='extreme'){ sweep(ctx,140,520,0,0.5,'sawtooth',0.1); tone(ctx,220,0,0.4,'sawtooth',0.1); tone(ctx,440,0.12,0.4,'sawtooth',0.08); }
  else if(kind==='lasthunt'){ tone(ctx,180,0,0.4,'square',0.15); noiseBurst(ctx,0,0.4,0.08); sweep(ctx,900,200,0.1,0.5,'sawtooth',0.07); }
  else if(kind==='victory'){ [523,659,784,1046,1318].forEach((f,i)=>tone(ctx,f,i*0.12,0.34,'triangle',0.16)); sparkle(ctx,0.7,1500,6,0.05); tone(ctx,1568,0.9,0.8,'sine',0.12); }
  else if(kind==='wheel'){
    /* clics de ruleta que se van espaciando hasta frenar */
    let t=0, d=0.06;
    while(t<3.85){ tone(ctx,1250,t,0.035,'square',0.05); d*=1.09; t+=d; }
    tone(ctx,1568,3.95,0.6,'sine',0.1); tone(ctx,2093,3.97,0.5,'sine',0.05);
  }
  else if(kind==='timer') tone(ctx,900,0,0.06,'square',0.1);
  else if(kind==='tick') { tone(ctx,700,0,0.09,'square',0.1); }
  else if(kind==='go') { tone(ctx,523,0,0.12,'triangle',0.16); tone(ctx,659,0.11,0.12,'triangle',0.16); tone(ctx,784,0.22,0.12,'triangle',0.16); tone(ctx,1046,0.33,0.35,'triangle',0.18); sweep(ctx,300,1400,0,0.5,'sawtooth',0.04); }
  else if(kind==='ding') { tone(ctx,1568,0,1.4,'sine',0.22); tone(ctx,2093,0,1.0,'sine',0.1); tone(ctx,3136,0,0.6,'sine',0.05); }
}

/* ---------------- música alegre tipo arcade (generada, sin archivos) ---------------- */
let musicState = null;
const M_BPM = 118;
const M_STEP = 60/M_BPM/2;                       // corchea
const M_BASS = [130.81, 98.00, 110.00, 87.31];    // Do, Sol, La(m), Fa
const M_CHORD = [[261.63,329.63,392.00],[246.94,293.66,392.00],[220.00,261.63,329.63],[220.00,261.63,349.23]];
const M_MEL = [
  [659.25,0,783.99,659.25,1046.5,0,783.99,659.25],
  [587.33,0,783.99,587.33,987.77,0,783.99,587.33],
  [659.25,0,880.00,659.25,1046.5,0,880.00,659.25],
  [698.46,0,880.00,698.46,1046.5,880.00,783.99,659.25]
];
function noteAt(ctx,freq,t,dur,type,gain,dest){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(gain,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+0.05);
}
function hatAt(ctx,t,dest){
  const n = Math.floor(ctx.sampleRate*0.04);
  const buf = ctx.createBuffer(1,n,ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s = ctx.createBufferSource(); s.buffer = buf;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g = ctx.createGain(); g.gain.value=0.05;
  s.connect(hp); hp.connect(g); g.connect(dest); s.start(t);
}
function kickAt(ctx,t,dest){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.2);
}
function startMusic(){
  if(musicState || !state.settings.music || !state.settings.sound) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.32, ctx.currentTime+1.2);
  master.connect(ctx.destination);
  let step = 0, next = ctx.currentTime+0.1;
  const timer = setInterval(()=>{
    if(!state.settings.sound || !state.settings.music || !audioCtx) { next = audioCtx ? audioCtx.currentTime+0.1 : 0; return; }
    const c = audioCtx;
    while(next < c.currentTime+0.25){
      const bar = Math.floor(step/8)%4, pos = step%8;
      // bajo saltarín
      if(pos===0||pos===4) noteAt(c,M_BASS[bar],next,M_STEP*1.7,'triangle',0.30,master);
      if(pos===2||pos===6) noteAt(c,M_BASS[bar]*2,next,M_STEP*0.8,'triangle',0.14,master);
      // acorde suave a contratiempo
      if(pos===2||pos===6) M_CHORD[bar].forEach(f=>noteAt(c,f,next,M_STEP*1.4,'sine',0.05,master));
      // percusión ligera
      if(pos===0||pos===4) kickAt(c,next,master);
      if(pos%2===1) hatAt(c,next,master);
      // melodía alegre
      const m = M_MEL[bar][pos];
      if(m) noteAt(c,m,next,M_STEP*1.5,'square',0.045,master);
      if(m && pos%4===0) noteAt(c,m*2,next,M_STEP*0.9,'sine',0.03,master);
      next += M_STEP; step++;
    }
  }, 40);
  musicState = {master,timer};
}
function stopMusic(){
  if(!musicState) return;
  const {master,timer} = musicState;
  musicState = null;
  clearInterval(timer);
  const c = audioCtx;
  if(c){
    master.gain.cancelScheduledValues(c.currentTime);
    master.gain.setTargetAtTime(0.0001, c.currentTime, 0.12);
    setTimeout(()=>{ try{ master.disconnect(); }catch(e){} }, 700);
  }
}
function toggleMusic(){
  state.settings.music = !state.settings.music;
  saveGame();
  if(state.settings.music){
    if(!state.settings.sound){ state.settings.sound = true; }
    ensureAudio(); startMusic(); showToast('🎵 Música activada');
  } else {
    stopMusic(); showToast('Música apagada');
  }
  syncAudioFabs();
  if(state.screen==='settings') render();
}
function syncAudioFabs(){
  const sf = document.getElementById('soundFab');
  if(sf) sf.textContent = state.settings.sound ? '🔊' : '🔇';
  const mf = document.getElementById('musicFab');
  if(mf){ mf.textContent = state.settings.music ? '🎵' : '🎶'; mf.classList.toggle('off', !(state.settings.music && state.settings.sound)); }
}

function avatarImgOrFallback(p, cls, fallbackCls){
  if(p && p.photo){
    return `<img src="${p.photo}" class="${cls}">`;
  }
  return `<div class="${fallbackCls}">${p?p.name.charAt(0).toUpperCase():'?'}</div>`;

function capturePlayerPhoto(playerId){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  // No forzamos "capture" para que el navegador ofrezca tanto cámara como galería.
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  document.body.appendChild(input);
  const cleanup = ()=>{ if(input.parentNode) input.parentNode.removeChild(input); };
  input.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file){ cleanup(); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const size = 240;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s2 = Math.min(img.width, img.height);
          const sx = (img.width - s2)/2, sy = (img.height - s2)/2;
          ctx.drawImage(img, sx, sy, s2, s2, 0, 0, size, size);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          const p = getPlayer(playerId);
          if(p){ p.photo = dataUrl; saveGame(); render(); showToast('Foto guardada 📷'); }
        }catch(err){
          console.warn('No se pudo procesar la foto', err);
          showToast('No se pudo procesar esa imagen');
        }
        cleanup();
      };
      img.onerror = ()=>{ showToast('No se pudo leer esa imagen'); cleanup(); };
      img.src = ev.target.result;
    };
    reader.onerror = ()=>{ showToast('No se pudo leer el archivo'); cleanup(); };
    reader.readAsDataURL(file);
  });
  input.addEventListener('cancel', cleanup);
  input.click();
}

/* ---------------- roulette ---------------- */
function eligibleSearchers(){
  if(state.players.length<=1) return state.players.slice();
  const others = state.players.filter(p=>p.id!==state.lastSearcherId);
  return others.length>0 ? others : state.players.slice();
}
function spinWheel(){
  if(wheelLocked) return;
  wheelLocked = true;
  const spinBtn = document.getElementById('spinWheelBtn');
  if(spinBtn) spinBtn.disabled = true;
  try{
    playUiSound('wheel');
    const wheelEl = document.getElementById('wheelEl');
    const pool = eligibleSearchers();
    if(!pool || pool.length===0) throw new Error('Sin jugadores disponibles');
    const winner = pool[Math.floor(Math.random()*pool.length)];
    const segAngle = 360/pool.length;
    const winnerIndex = pool.findIndex(p=>p.id===winner.id);
    const targetAngle = 360*5 + (360 - (winnerIndex*segAngle + segAngle/2)) ;
    if(wheelEl){
      wheelEl.style.transform = `rotate(${targetAngle}deg)`;
    }
    setTimeout(()=>{
      state.currentSearcherId = winner.id;
      winner.timesSearcher = (winner.timesSearcher||0)+1;
      saveGame();
      const resEl = document.getElementById('wheelResult');
      const nameEl = document.getElementById('wheelResultName');
      if(resEl) resEl.style.display='block';
      if(nameEl) nameEl.textContent = winner.name.toUpperCase();
    }, 4050);
  }catch(e){
    console.warn('Error al girar la ruleta', e);
    wheelLocked = false;
    if(spinBtn) spinBtn.disabled = false;
    showToast('Hubo un problema, intenta girar de nuevo');
  }
}

function shuffleCards(){
  const arr = CARDS.map(c=>c.id);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function assignCards(hidingPlayers){
  const shuffled = shuffleCards();
  const map = {};
  hidingPlayers.forEach((p,i)=>{ map[p.id] = shuffled[i % shuffled.length] && i < shuffled.length ? shuffled[i] : shuffled[i]; });
  // ensure no repeats & searcher gets none: since hidingPlayers <=10 and 11 cards, safe
  hidingPlayers.forEach((p,i)=>{ map[p.id] = shuffled[i]; });
  return map;
}
function startRound(){
  pushUndo();
  state.round += 1;
  const hidingPlayers = state.players.filter(p=>p.id!==state.currentSearcherId);
  const cardMap = assignCards(hidingPlayers);
  const statuses = {};
  hidingPlayers.forEach(p=>{ statuses[p.id] = 'hidden'; });
  state.roundData = {
    statuses,
    cards: cardMap,
    firstLiberatorId: null,
    rescueDone: false,
    lastFoundId: null,
    log: [] // {playerId,event,points}
  };
  state.lastSearcherId = state.currentSearcherId;
  state.screen = 'round';
  saveGame();
  render();
}

function finishRound(){
  if(!state.roundData) return;
  if(hiddenRemaining().length>0){ showToast('Aún quedan jugadores escondidos'); return; }
  pushUndo();
  checkRoundEnd();
  render();
}
function hiddenRemaining(){
  const rd = state.roundData; if(!rd) return [];
  return Object.keys(rd.statuses).filter(id=>rd.statuses[id]==='hidden');
}

function openFindModal(){
  const rd = state.roundData;
  const hidden = hiddenRemaining();
  if(hidden.length===0){ showToast('No quedan jugadores escondidos'); return; }
  renderOverlay('find', {hidden});
}
function findPlayer(playerId){
  pushUndo();
  const rd = state.roundData;
  const wasLastHidden = hiddenRemaining().length===1 && hiddenRemaining()[0]===playerId;
  rd.statuses[playerId] = 'found';
  const p = getPlayer(playerId);
  p.foundCount = (p.foundCount||0)+1;
  // streak breaks on being found (unless later liberated)
  if(wasLastHidden){
    rd.lastFoundId = playerId;
    p.timesLastFound = (p.timesLastFound||0)+1;
  }
  // Puntos del Buscador: +1 por cada jugador encontrado
  const searcher = getPlayer(state.currentSearcherId);
  if(searcher){
    const gained = searcher.extremeMode ? 0 : 1;
    searcher.points += gained;
    rd.log.push({playerId:searcher.id, event:'buscador_encontro', points:gained});
    if(gained>0) checkGameStateAfterPoints(searcher);
  }
  saveGame();
  closeOverlay();
  render();
  const foundP = getPlayer(playerId);
  showSearcherBanner(`🔎 ¡Encontró a ${foundP?foundP.name:'alguien'}! +${searcher&&!searcher.extremeMode?1:0}`);
  if(state.winner) return;
  const card = CARDS.find(c=>c.id===rd.cards[playerId]);
  renderOverlay('cardReveal', {playerId, card, mode:'found'});
}

function openSearcherLiberateModal(){
  const rd = state.roundData;
  const trapped = Object.keys(rd.statuses).filter(id=>rd.statuses[id]==='found');
  if(trapped.length===0){ showToast('No hay jugadores encontrados para liberar'); return; }
  renderOverlay('searcherLiberate', {trapped});
}
function searcherLiberates(targetId){
  const rd = state.roundData;
  if(rd.statuses[targetId]!=='found'){ showToast('Ese jugador no está atrapado'); return; }
  pushUndo();
  const searcher = getPlayer(state.currentSearcherId);
  const target = getPlayer(targetId);
  rd.statuses[targetId] = 'liberated';
  target.liberations = (target.liberations||0)+1;
  target.rescuedCount = (target.rescuedCount||0)+1;
  rd.log.push({playerId:targetId, event:'liberado_por_buscador', points:0});
  const gained = searcher.extremeMode ? 0 : 2;
  searcher.points += gained;
  searcher.rescues = (searcher.rescues||0)+1;
  rd.log.push({playerId:searcher.id, event:'buscador_libero', points:gained});
  saveGame();
  closeOverlay();
  showSearcherBanner(`🤝 ¡Liberó a ${target.name}! +${gained}`);
  if(gained>0) checkGameStateAfterPoints(searcher);
  if(state.winner){ render(); return; }
  checkRoundEnd();
  render();
}
function openLiberateModal(){
  const rd = state.roundData;
  const eligible = Object.keys(rd.statuses).filter(id=>rd.statuses[id]==='hidden'||rd.statuses[id]==='found');
  if(eligible.length===0){ showToast('No hay jugadores disponibles'); return; }
  renderOverlay('liberate', {eligible});
}
function liberatePlayer(playerId){
  pushUndo();
  const rd = state.roundData;
  const wasFound = rd.statuses[playerId]==='found';
  const wasLastFound = rd.lastFoundId===playerId;
  rd.statuses[playerId] = 'liberated';
  const p = getPlayer(playerId);
  p.liberations = (p.liberations||0)+1;

  // streak logic
  p.streak = (p.streak||0)+1;
  let bonus = 0;
  if(p.streak>0 && p.streak%3===0 && !p.extremeMode) bonus = 1;

  const base = wasFound ? 2 : 3;
  const awarded = p.extremeMode ? 0 : (base+bonus);
  p.points += awarded;

  rd.log.push({playerId, event: wasFound?'liberado_tras_encontrado':'liberado_directo', points:awarded});

  const isFirstLiberator = !rd.firstLiberatorId;
  if(isFirstLiberator) rd.firstLiberatorId = playerId;

  saveGame();
  closeOverlay();
  checkGameStateAfterPoints(p);

  if(isFirstLiberator){
    const trapped = Object.keys(rd.statuses).filter(id=> rd.statuses[id]==='found' );
    if(trapped.length>0){
      renderOverlay('rescue', {liberatorId:playerId, trapped});
      return;
    }
  }
  checkRoundEnd();
  render();
}
function rescuePlayer(liberatorId, targetId){
  const rd = state.roundData;
  if(rd.rescueUsed){ showToast('Ya hubo un rescate en esta ronda'); return; }
  if(rd.statuses[targetId]!=='found'){ showToast('Ese jugador no está atrapado'); return; }
  pushUndo();
  rd.rescueUsed = true;
  rd.statuses[targetId] = 'liberated';
  rd.rescueDone = true;
  const target = getPlayer(targetId);
  const liberator = getPlayer(liberatorId);
  target.liberations = (target.liberations||0)+1;
  target.rescuedCount = (target.rescuedCount||0)+1;
  liberator.rescues = (liberator.rescues||0)+1;
  // lock: liberator can't rescue this same target for next 3 rounds
  state.rescueLocks[liberatorId] = state.rescueLocks[liberatorId] || {};
  state.rescueLocks[liberatorId][targetId] = 3;

  rd.log.push({playerId:targetId, event:'rescatado_por_'+liberator.name, points:0});
  saveGame();
  closeOverlay();
  showToast(`${liberator.name} liberó a ${target.name} 🤝`);
  checkRoundEnd();
  render();
}
function searcherFreesPlayer(playerId){
  const rd = state.roundData;
  if(!rd || rd.statuses[playerId]!=='found') return;
  pushUndo();
  rd.statuses[playerId] = 'liberated';
  const p = getPlayer(playerId);
  p.streak = 0; // no se liberó por sí mismo
  const searcher = getPlayer(state.currentSearcherId);
  rd.log.push({playerId, event:'liberado_por_buscador', points:0});
  saveGame();
  closeOverlay();
  showToast(`${searcher?searcher.name:'El Buscador'} liberó a ${p.name} 🔎`);
  checkRoundEnd();
  render();
}
function isRescueLocked(liberatorId, targetId){
  const locks = state.rescueLocks[liberatorId];
  return !!(locks && locks[targetId] && locks[targetId]>0);
}

function checkGameStateAfterPoints(p){
  if(p.points>=9 && !p.extremeMode && p.extremeRoundsLeft===undefined) p.extremeRoundsLeft=0;
  if(p.points>=9 && !p.extremeMode && p.points<12){
    p.extremeMode = true;
    p.extremeRoundsLeft = 3;
    playUiSound('extreme');
    showToast(`👑 ${p.name} entra en MODO EXTREMO`);
  } else {
    playUiSound('point');
  }
  if(p.points>=10 && !state.finalHunt.active){
    state.finalHunt.active = true;
    state.finalHunt.triggerRound = state.round;
    playUiSound('lasthunt');
    showToast('🚨 ÚLTIMA CAZA ACTIVADA');
  }
  if(p.points>=12 && !p.extremeMode){
    declareWinner(p);
  }
}
function declareWinner(p){
  state.pendingNextRound = false;
  state.winner = p.id;
  state.screen='victory';
  playUiSound('victory');
  saveGame();
}

function decrementExtremeAndRescueLocks(){
  state.players.forEach(p=>{
    if(p.extremeMode){
      p.extremeRoundsLeft -= 1;
      if(p.extremeRoundsLeft<=0){
        p.extremeMode=false;
        p.extremeRoundsLeft=0;
        showToast(`${p.name} sale de Modo Extremo`);
        if(p.points>=12){ declareWinner(p); }
      }
    }
  });
  Object.keys(state.rescueLocks).forEach(lib=>{
    Object.keys(state.rescueLocks[lib]).forEach(tgt=>{
      state.rescueLocks[lib][tgt] -= 1;
      if(state.rescueLocks[lib][tgt]<=0) delete state.rescueLocks[lib][tgt];
    });
  });
}

function checkRoundEnd(){
  if(hiddenRemaining().length>0) return;
  const rd = state.roundData;
  // resolve any found-not-liberated players
  Object.keys(rd.statuses).forEach(id=>{
    if(rd.statuses[id]==='found'){
      const p = getPlayer(id);
      p.streak = 0; // streak broken
      const isLast = rd.lastFoundId===id;
      const awarded = p.extremeMode ? 0 : (isLast?1:0);
      p.points += awarded;
      rd.log.push({playerId:id, event: isLast?'ultimo_encontrado':'encontrado_no_liberado', points:awarded});
      if(awarded>0) checkGameStateAfterPoints(p);
    } else if(rd.statuses[id]==='liberated'){
      // streak already updated at liberation time
    }
  });
  const _s = getPlayer(state.currentSearcherId); if(_s) _s.streak = 0;
  // build history entry
  const entry = {
    round: state.round,
    searcherId: state.currentSearcherId,
    liberationPoint: state.liberationPoint,
    log: rd.log.slice(),
    cards: {...rd.cards},
    statuses: {...rd.statuses}
  };
  state.history.push(entry);
  decrementExtremeAndRescueLocks();
  saveGame();

  if(state.winner){ return; }
  if(state.finalHunt.active && state.round > state.finalHunt.triggerRound){
    finishGameByLastHunt();
    return;
  }
  showMomentOfRound(entry);
}
function computeMomentOfRound(entry){
  const opts = [];
  if(entry.lastFoundId===undefined){}
  const lastFound = Object.keys(entry.statuses).find(id=>state.roundData && state.roundData.lastFoundId===id);
  const rd = state.roundData;
  if(rd.lastFoundId){
    const p = getPlayer(rd.lastFoundId);
    if(p) opts.push(`${p.name.toUpperCase()} fue el último jugador encontrado.`);
  }
  const notFound = state.players.filter(p=> entry.statuses[p.id]==='liberated' && !entry.log.find(l=>l.playerId===p.id && l.event==='liberado_tras_encontrado'));
  if(notFound.length>0){
    const pick = notFound[Math.floor(Math.random()*notFound.length)];
    opts.push(`${pick.name.toUpperCase()} no fue encontrado y se liberó sin ser visto.`);
  }
  const rescuer = entry.log.find(l=>l.event && l.event.startsWith('rescatado_por_'));
  if(rescuer){
    opts.push(`Hubo un rescate heroico que cambió la ronda.`);
  }
  const topScorer = [...state.players].sort((a,b)=>b.points-a.points)[0];
  if(topScorer) opts.push(`${topScorer.name.toUpperCase()} lidera la clasificación con ${topScorer.points} puntos.`);
  if(opts.length===0) opts.push('Ronda completada sin grandes sorpresas.');
  return opts[Math.floor(Math.random()*opts.length)];
}
function showMomentOfRound(entry){
  const msg = computeMomentOfRound(entry);
  state.screen='moment';
  state.pendingNextRound = true;
  state._momentMsg = msg;
  saveGame();
  render();
}
function finishGameByLastHunt(){
  const sorted = [...state.players].sort((a,b)=>b.points-a.points);
  const top = sorted[0];
  const tied = sorted.filter(p=>p.points===top.points);
  if(tied.length>1){
    state.screen='tiebreak';
    state._tied = tied.map(p=>p.id);
    saveGame(); render();
  } else {
    declareWinner(top);
    render();
  }
}
function roundIsFinished(){
  if(!state.roundData || state.winner) return false;
  if(Object.keys(state.roundData.statuses).length===0) return false;
  if(hiddenRemaining().length>0) return false;
  const last = state.history[state.history.length-1];
  return !!last && last.round===state.round;
}
function updateNextRoundFab(){
  const fab = document.getElementById('nextRoundFab');
  if(!fab) return;
  const navScreens = ['round','leaderboard','cards','history','stats','rules','settings','presenter'];
  fab.style.display = (navScreens.includes(state.screen) && roundIsFinished()) ? 'flex' : 'none';

  state.screen='roulette';
  render();
}

let timerInterval=null;
function startCustomTimer(seconds){
  clearInterval(timerInterval);
  state._timer = {seconds, initial:seconds, running:true};
  renderTimerUI();
  timerInterval = setInterval(()=>{
    if(!state._timer.running) return;
    state._timer.seconds -= 1;
    if(state._timer.seconds<=0){
      state._timer.seconds=0;
      state._timer.running=false;
      clearInterval(timerInterval);
      playUiSound('timer');
    }
    renderTimerUI();
  },1000);
}
function pauseTimer(){ state._timer.running = !state._timer.running; renderTimerUI(); }
function resetTimer(){ clearInterval(timerInterval); state._timer.seconds = state._timer.initial||0; state._timer.running=false; renderTimerUI(); }
function renderTimerUI(){
  const disp = document.getElementById('timerDisplay');
  if(disp) disp.textContent = (state._timer.seconds||0);
  const pb = document.getElementById('timerPauseBtn');
  if(pb) pb.textContent = state._timer.running ? '⏸ PAUSAR' : '▶ INICIAR';
}

/* ---------------- export / import ---------------- */
function exportGame(){
  const { undoStack, _timer, ...toExport } = state;
  const blob = new Blob([JSON.stringify(toExport,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'escondidijo_extremo_partida.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importGameFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      data.undoStack = [];
      data._timer = {seconds:0, running:false, initial:0};
      state = data;
      saveGame();
      render();
      showToast('Partida importada ✅');
    }catch(err){ showToast('Archivo inválido'); }
  };
  reader.readAsText(file);
}

function buildWheelSVG(pool){
  const n = pool.length, seg = 360/n;
  const colors = ['#ff5b82','#2fd6b0','#ffc93c','#7b5cff','#3fa9ff'];
  const pt = (deg,r)=>{ const a=(deg-90)*Math.PI/180; return [ (r*Math.cos(a)).toFixed(2), (r*Math.sin(a)).toFixed(2) ]; };
  let out = '';
  pool.forEach((p,i)=>{
    let col = colors[i%colors.length];
    if(i===n-1 && n>1 && col===colors[0]) col = colors[(i+2)%colors.length];
    const a0=i*seg, a1=(i+1)*seg;
    const [x0,y0]=pt(a0,100), [x1,y1]=pt(a1,100);
    const large = seg>180?1:0;
    out += `<path d="M0 0 L${x0} ${y0} A100 100 0 ${large} 1 ${x1} ${y1} Z" fill="${col}" stroke="#1a1450" stroke-width="2"/>`;
    let name = p.name.toUpperCase();
    if(name.length>11) name = name.slice(0,10)+'…';
    const fs = Math.max(7, Math.min(13, 62/Math.max(name.length,4)*1.5));
    const mid = a0+seg/2;
    out += `<text transform="rotate(${mid-90})" x="92" y="0" text-anchor="end" dominant-baseline="central" font-family="Lilita One,Fredoka,sans-serif" font-weight="400" font-size="${fs.toFixed(1)}" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round">${name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;
  });
  return `<svg viewBox="-100 -100 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">${out}</svg>`;
}

      list.appendChild(el(`<div class="player-round-row"><div>${icon}</div><div class="name">${p.name}</div></div>`));
    });
    wrap.appendChild(list);
  }
  wrap.appendChild(renderLeaderboard());
  return wrap;
}

function makeConfetti(){
  const box = document.createElement('div'); box.className='confetti';
  const cols = ['#ffc93c','#ff5b82','#43ee95','#4cb4ff','#b07cff'];
  for(let i=0;i<42;i++){
    const c = document.createElement('i');
    c.style.cssText = `left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%5]};animation-duration:${(3+Math.random()*3).toFixed(1)}s;animation-delay:-${(Math.random()*5).toFixed(1)}s;transform:rotate(${Math.random()*360|0}deg)`;
    box.appendChild(c);
  }
  return box;
}
function renderVictory(){
  const w = getPlayer(state.winner);
  const wrap = el(`
    <div class="victory">
      <div class="cups">🏆🏆🏆</div>
      <h1>¡TENEMOS GANADOR!</h1>
      <div class="name">${w?w.name.toUpperCase():'—'}</div>

/* ---------------- overlays / modals ---------------- */
let pendingConfirm=null;
function askConfirm(title, msg, yesLabel, cb){
  pendingConfirm = cb;
  renderOverlay('confirm', {title, msg, yesLabel});
}
function runConfirm(){
  const cb = pendingConfirm; pendingConfirm=null;
  closeOverlay();
  if(cb) cb();
}
function saveEditName(id){
  const v = document.getElementById('editNameInput').value;
  closeOverlay();
  editPlayer(id, v);
}
let cardMoveH=null, cardUpH=null;
function closeOverlay(){
  if(cardMoveH){ window.removeEventListener('mousemove', cardMoveH); cardMoveH=null; }
  if(cardUpH){ window.removeEventListener('mouseup', cardUpH); cardUpH=null; }
  stopActiveCamStream();
  const host = document.getElementById('overlays');
  host.innerHTML='';
}
function renderOverlay(kind, data){
  if(cardMoveH){ window.removeEventListener('mousemove', cardMoveH); cardMoveH=null; }
  if(cardUpH){ window.removeEventListener('mouseup', cardUpH); cardUpH=null; }
  if(kind!=='cameraCapture') stopActiveCamStream();
  const host = document.getElementById('overlays');
  host.innerHTML='';
  if(kind==='cameraCapture'){
    renderCameraCaptureOverlay(data.playerId);
    return;
  }
  if(kind==='confirm'){
    const ov = el(`
      <div class="overlay center">
        <div class="sheet" style="max-width:340px;">
          <h3>${data.title}</h3>
          <p style="color:var(--dim); font-size:14px;">${data.msg}</p>
          <button class="btn btn-primary" onclick="runConfirm()">${data.yesLabel||'Aceptar'}</button>
          <button class="btn btn-ghost" onclick="pendingConfirm=null; closeOverlay()">Cancelar</button>
        </div>
      </div>`);
    host.appendChild(ov);
    return;
  }
  if(kind==='editName'){
    const ov = el(`
      <div class="overlay center">
        <div class="sheet" style="max-width:340px;">
          <h3>✏️ Editar nombre</h3>
          <input type="text" id="editNameInput">
          <button class="btn btn-cyan" onclick="saveEditName('${data.id}')">Guardar</button>
          <button class="btn btn-ghost" onclick="closeOverlay()">Cancelar</button>
        </div>
      </div>`);
    host.appendChild(ov);
    const inp = ov.querySelector('#editNameInput');
    inp.value = data.name;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') saveEditName(data.id); });
    setTimeout(()=>inp.focus(),50);
    return;
  }
  if(kind==='confirmNewGame'){
    const ov = el(`
      <div class="overlay center">
        <div class="sheet" style="max-width:340px;">
          <h3>¿Nueva partida?</h3>
          <p style="color:var(--dim); font-size:14px;">Ya existe una partida guardada. Empezar una nueva la reemplazará.</p>
          <button class="btn btn-primary" onclick="confirmNewGame()">Sí, empezar nueva</button>
          <button class="btn btn-ghost" onclick="closeOverlay()">Cancelar</button>
        </div>
      </div>`);
    host.appendChild(ov);
    return;
  }
  if(kind==='find'){
    const ov = el(`<div class="overlay"><div class="sheet"><div class="close-row"><button class="x" onclick="closeOverlay()">✕</button></div><h3>🔎 ¿A quién encontraste?</h3></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.hidden.forEach(id=>{
      const p = getPlayer(id);
      const b = el(`<button class="btn btn-secondary">${p.name}</button>`);
      b.onclick = ()=> findPlayer(id);
      sheet.appendChild(b);
    });
    host.appendChild(ov);
    return;
  }
  if(kind==='cardReveal'){
    renderCardRevealOverlay(data);
    return;
  }
  if(kind==='liberate'){
    const rd = state.roundData;
    const ov = el(`<div class="overlay"><div class="sheet"><div class="close-row"><button class="x" onclick="closeOverlay()">✕</button></div><h3>🟢 ¿Quién quedó libre?</h3><p style="color:var(--dim); font-size:13px;">Elige si el jugador llegó solo al Punto de Liberación o si lo liberó otro jugador (rescate).</p></div></div>`);
    const sheet = ov.querySelector('.sheet');
    const first = rd.firstLiberatorId ? getPlayer(rd.firstLiberatorId) : null;
    data.eligible.forEach(id=>{
      const p = getPlayer(id);
      const wasFound = rd.statuses[id]==='found';
      sheet.appendChild(el(`<div class="section-title" style="margin:16px 0 4px;">${p.name}</div>`));
      const self = el(`<button class="btn btn-cyan" style="margin-top:6px;">🏃 SE LIBERÓ SOLO ${wasFound?'(+2)':'(+3)'}</button>`);
      self.onclick = ()=> liberatePlayer(id);
      sheet.appendChild(self);
      if(wasFound){
        let label, disabled=false;
        if(rd.rescueDone){ label='🤝 LO LIBERARON (ya hubo rescate esta ronda)'; disabled=true; }
        else if(!first){ label='🤝 LO LIBERARON (aún nadie se liberó)'; disabled=true; }
        else if(first.id===id){ label='🤝 LO LIBERARON'; disabled=true; }
        else if(isRescueLocked(first.id,id)){ label=`🔒 ${first.name} no puede liberarlo (${state.rescueLocks[first.id][id]} rondas)`; disabled=true; }
        else { label=`🤝 LO LIBERÓ ${first.name.toUpperCase()} (rescate)`; }
        const resc = el(`<button class="btn ${disabled?'btn-ghost':'btn-gold'}" ${disabled?'disabled':''}>${label}</button>`);
        if(!disabled) resc.onclick = ()=> rescuePlayer(first.id, id);
        sheet.appendChild(resc);
      }
    });
    host.appendChild(ov);
    return;
  }
  if(kind==='searcherLiberate'){
    const searcher = getPlayer(state.currentSearcherId);
    const ov = el(`<div class="overlay"><div class="sheet"><div class="close-row"><button class="x" onclick="closeOverlay()">✕</button></div><h3>🤝 ¿A quién libera ${searcher?searcher.name:'el Buscador'}?</h3><p style="color:var(--dim); font-size:13px;">El jugador queda liberado (sin puntos para él) y el Buscador suma +2.</p></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.trapped.forEach(id=>{
      const p = getPlayer(id);
      const b = el(`<button class="btn btn-gold">${p.name}</button>`);
      b.onclick = ()=> searcherLiberates(id);
      sheet.appendChild(b);
    });
    host.appendChild(ov);
    return;
  }
  if(kind==='rescue'){
    const ov = el(`<div class="overlay"><div class="sheet"><h3>🤝 ELIGE A QUIÉN LIBERAR</h3><p style="color:var(--dim); font-size:13px;">El primer jugador en liberarse puede rescatar a un jugador atrapado.</p></div></div>`);
    const sheet = ov.querySelector('.sheet');
    data.trapped.forEach(id=>{
      const p = getPlayer(id);
      const locked = isRescueLocked(data.liberatorId, id) || state.roundData.rescueDone;
      const b = el(`<button class="btn ${locked?'btn-ghost':'btn-gold'}" ${locked?'disabled':''}>${locked?'🔒 ':''}${p.name} ${locked?(state.roundData.rescueDone?'<br><small>Ya hubo un rescate</small>':'<br><small>No disponible durante '+((state.rescueLocks[data.liberatorId]||{})[id]||0)+' rondas</small>'):''}</button>`);
      if(!locked) b.onclick = ()=> rescuePlayer(data.liberatorId, id);
      sheet.appendChild(b);
    });
    const skip = el(`<button class="btn btn-ghost">No rescatar a nadie</button>`);
    skip.onclick = ()=>{ closeOverlay(); checkRoundEnd(); render(); };
    sheet.appendChild(skip);
    host.appendChild(ov);
    return;
  }
}

function renderCardRevealOverlay({playerId, card, mode}){
  const host = document.getElementById('overlays');
  const p = getPlayer(playerId);
  const ov = el(`
    <div class="overlay center">
      <div class="sheet" style="max-width:280px; background:transparent; box-shadow:none; padding:0; border:none; animation:none; overflow:visible;">
        <div class="facade-wrap">
          <div class="facade-stage">
            <div class="card-face ${card.type}" id="cardFace" style="display:none;">
              <div class="tag">${card.emoji}</div>
              <div class="title">${card.title}</div>
              <div class="body">${card.text}</div>
            </div>
            <div class="facade" id="facadeEl">
              <div class="big">🃏</div>
              <div class="who">${p.name.toUpperCase()}</div>
              <div class="arrow">↑</div>
              <div class="hint">DESLIZA PARA REVELAR CARTA</div>
            </div>
          </div>
          <button class="btn btn-ghost" id="hideCardBtn" style="max-width:220px; display:none;">🔒 OCULTAR CARTA</button>
          <button class="btn btn-ghost" style="max-width:220px;" onclick="closeOverlay()">Cerrar</button>
        </div>
      </div>
    </div>`);
  host.appendChild(ov);

  const facade = ov.querySelector('#facadeEl');
  const cardFace = ov.querySelector('#cardFace');
  const hideBtn = ov.querySelector('#hideCardBtn');
  let startY=null, dragging=false, revealed=false;

  function reveal(){
    if(revealed) return;
    revealed = true;
    playCardRevealSound();
    facade.style.transition = 'transform .45s cubic-bezier(.2,.8,.3,1), opacity .45s ease';
    facade.style.transform = 'translateY(-360px) rotate(-8deg)';
    facade.style.opacity='0';
    cardFace.style.display='flex';
    hideBtn.style.display='block';
    setTimeout(()=>{ facade.style.display='none'; }, 460);
  }
  function hide(){
    revealed=false;
    cardFace.style.display='none';
    hideBtn.style.display='none';
    facade.style.display='flex';
    facade.style.transition='none';
    facade.style.transform='translateY(0) rotate(0)';
    facade.style.opacity='1';
  }
  hideBtn.onclick = hide;

  function onDown(y){ startY=y; dragging=true; facade.style.cursor='grabbing'; }
  function onMove(y){
    if(!dragging||startY===null) return;
    const delta = startY - y;
    if(delta>0){
      facade.style.transition='none';
      facade.style.transform = `translateY(${-delta}px) rotate(${-delta/18}deg)`;
      facade.style.opacity = Math.max(0.2, 1-delta/260);
    }
  }
  function onUp(y){
    if(!dragging) return;
    dragging=false;
    const delta = startY!==null && y!==null ? startY-y : 0;
    if(delta>70){ reveal(); }
    else{
      facade.style.transition='transform .25s ease, opacity .25s ease';
      facade.style.transform='translateY(0) rotate(0)';
      facade.style.opacity='1';
    }
    startY=null;
  }
  facade.addEventListener('touchstart', e=>onDown(e.touches[0].clientY), {passive:true});
  facade.addEventListener('touchmove', e=>onMove(e.touches[0].clientY), {passive:true});
  facade.addEventListener('touchend', e=>onUp(e.changedTouches[0].clientY));
  facade.addEventListener('mousedown', e=>onDown(e.clientY));
  cardMoveH = e=>{ if(dragging) onMove(e.clientY); };
  cardUpH = e=>{ if(dragging) onUp(e.clientY); };
  window.addEventListener('mousemove', cardMoveH);
  window.addEventListener('mouseup', cardUpH);
  // tap fallback (click)
  facade.addEventListener('click', ()=>{ if(!revealed && !dragging) reveal(); });
}

/* ---------------- init ---------------- */
(function buildSpace(){
  const host = document.getElementById('stars');
  if(host){
    const frag = document.createDocumentFragment();
    for(let i=0;i<70;i++){
      const s = document.createElement('span');
      const size = Math.random()<0.15 ? 3 : (Math.random()<0.5 ? 2 : 1.5);
      s.style.cssText = `left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;--s:${size}px;--t:${(2+Math.random()*4).toFixed(1)}s;--sd:-${(Math.random()*5).toFixed(1)}s`;
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }
  let raf = 0, mx = 0, my = 0;
  const apply = ()=>{
    raf = 0;
    document.documentElement.style.setProperty('--px', mx.toFixed(3));
    document.documentElement.style.setProperty('--py', my.toFixed(3));
  };
  window.addEventListener('pointermove', e=>{
    mx = (e.clientX/window.innerWidth-.5)*2; my = (e.clientY/window.innerHeight-.5)*2;
    if(!raf) raf = requestAnimationFrame(apply);
  }, {passive:true});
  window.addEventListener('deviceorientation', e=>{
    if(e.gamma==null) return;
    mx = Math.max(-1,Math.min(1,e.gamma/30)); my = Math.max(-1,Math.min(1,((e.beta||45)-45)/30));
    if(!raf) raf = requestAnimationFrame(apply);
  }, {passive:true});
})();

/* sonido + vibración suave en todos los botones */
document.addEventListener('click', (e)=>{
  const t = e.target.closest ? e.target.closest('button, .switch') : null;
  if(!t || t.disabled || t.classList.contains('shutter-btn')) return;
  if(state.settings.music && !musicState) startMusic();
  let kind = 'click';
  if(t.closest('.bottomnav, .topnav')) kind = 'nav';
  else if(t.classList.contains('btn-ghost') || t.classList.contains('x') || t.classList.contains('cam-back-btn')) kind = 'back';
  else if(t.classList.contains('btn-primary') || t.classList.contains('next-fab') || t.id==='nextRoundFab') kind = 'start';
  else if(t.classList.contains('btn-cyan') || t.classList.contains('btn-gold')) kind = 'confirm';
  playUiSound(kind);
  if(navigator.vibrate){ try{ navigator.vibrate(kind==='start' ? 18 : 9); }catch(_){} }
}, true);

render();
